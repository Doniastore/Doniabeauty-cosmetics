    [hidden] {
      display: none !important
    }

    html {
      scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px);
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Readex Pro', Tahoma, system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.65
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer;
      background: none;
      border: 0;
      padding: 0
    }

    a {
      color: inherit
    }

    svg.ic {
      flex: none;
      display: block
    }

    .num {
      direction: ltr;
      unicode-bidi: isolate;
      display: inline-block
    }

    :focus-visible {
      outline: 2px solid var(--bronze);
      outline-offset: 2px
    }

    /* announcement + header */
    .promo {
      background: var(--deep);
      color: var(--deep-ink);
      text-align: center;
      font-size: 13px;
      padding: 8px 12px
    }

    .hdr {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 20;
      background: var(--bg);
      border-bottom: 1px solid var(--line)
    }

    .hdr-in {
      position: relative
    }

    .hdr-in {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 6px 10px;
      max-width: 1100px;
      margin: 0 auto
    }

    .hdr-start {
      display: flex
    }

    .hdr-end {
      display: flex;
      justify-content: flex-end
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      direction: ltr
    }

    .logo img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: block;
      box-shadow: 0 0 0 1px var(--line)
    }

    .logo span {
      font-family: var(--display);
      font-weight: 600;
      font-size: 24px;
      letter-spacing: .24em;
      padding-inline-start: .24em;
      line-height: 1
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      position: relative
    }

    .icon-btn:hover {
      background: var(--sage)
    }

    .badge {
      position: absolute;
      top: 3px;
      inset-inline-end: 1px;
      min-width: 19px;
      height: 19px;
      padding: 0 5px;
      border-radius: 10px;
      background: var(--rose);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      display: grid;
      place-items: center;
      line-height: 1
    }

    .badge.bump {
      animation: bump .35s
    }

    @keyframes bump {
      50% {
        transform: scale(1.35)
      }
    }

    .searchbar {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 12px 10px
    }

    .dnav {
      position: absolute;
      top: calc(100% + 8px);
      inset-inline-start: 10px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 210px;
      max-width: calc(100vw - 20px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 8px;
      box-shadow: 0 14px 32px rgba(74, 44, 29, .16);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px);
      transition: opacity .16s ease, transform .16s ease, visibility .16s
    }

    .dnav.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0)
    }

    .dlink {
      display: block;
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 500;
      font-size: 15px;
      color: var(--ink);
      text-decoration: none;
      white-space: nowrap;
      text-align: start
    }

    .dlink:hover {
      background: var(--sage)
    }

    @media(min-width:900px) {
      .hdr-in {
        grid-template-columns: auto 1fr auto auto;
        gap: 6px;
        padding: 8px 16px
      }

      .hdr-start,
      .hdr-end {
        display: contents
      }

      #btnMenu {
        order: 0
      }

      .logo {
        order: 1
      }

      #btnSearch {
        order: 3
      }

      #btnCart {
        order: 4
      }

      .logo img {
        width: 46px;
        height: 46px
      }
    }

    /* buttons + inputs */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 50px;
      padding: 0 26px;
      border-radius: 999px;
      background: var(--btn);
      color: var(--btn-ink);
      font-weight: 600;
      text-decoration: none;
      text-align: center
    }

    .btn[disabled] {
      opacity: .5;
      cursor: not-allowed
    }

    .btn.wa {
      background: var(--wa);
      color: #fff
    }

    .btn.ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line)
    }

    .btn.block {
      width: 100%
    }

    .input {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      padding: 0 14px;
      font-size: 16px
    }

    textarea.input {
      padding: 12px 14px;
      min-height: 78px;
      resize: vertical
    }

    /* hero */
    .hero {
      max-width: 1100px;
      margin: 14px auto 0;
      padding: 0 12px
    }

    .hero-card {
      background: var(--hero-bg);
      color: var(--ink);
      border-radius: 28px;
      position: relative;
      padding: 28px 22px 0;
      overflow: hidden;
      display: grid;
      gap: 10px
    }

    .hero h1 {
      font-family: var(--serif);
      font-size: clamp(32px, 8.6vw, 54px);
      line-height: 1.25;
      font-weight: 700
    }

    .hero p {
      color: var(--muted);
      max-width: 34ch
    }

    .hero .btn {
      justify-self: start;
      margin-top: 8px
    }

    .hero-art {
      position: relative;
      height: 235px;
      margin-top: 6px
    }

    .halo {
      position: absolute;
      width: 290px;
      height: 290px;
      border-radius: 50%;
      background: var(--halo);
      left: 50%;
      bottom: -62px;
      transform: translateX(-50%)
    }

    .halo::after {
      content: '';
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      border: 1.5px solid var(--bronze);
      opacity: .55
    }

    .hero-art svg {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: auto
    }

    .a1 {
      height: 72%;
      transform: translateX(-96%) rotate(-5deg);
      transform-origin: bottom
    }

    .a2 {
      height: 97%;
      transform: translateX(-50%)
    }

    .a3 {
      height: 72%;
      transform: translateX(-4%) rotate(5deg);
      transform-origin: bottom
    }

    @media(min-width:760px) {
      .hero-card {
        grid-template-columns: 1.05fr 1fr;
        align-items: center;
        padding: 44px 52px 0
      }

      .hero-art {
        height: 360px
      }

      .halo {
        width: 450px;
        height: 450px;
        bottom: -95px
      }
    }

    /* photos (تظهر لما تضاف صور حقيقية) */
    .ph {
      height: 100%;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      mix-blend-mode: multiply;
      display: block
    }

    .hero-card.has-photo {
      padding: 0;
      display: block;
      min-height: min(118vw, 600px)
    }

    .hero-card.has-photo .hero-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .hero-card.has-photo .hero-copy {
      position: absolute;
      inset-inline: 0;
      bottom: 0;
      padding: 90px 22px 28px;
      background: linear-gradient(to top, rgba(28, 18, 12, .7), rgba(28, 18, 12, 0));
      display: grid;
      justify-items: center;
      text-align: center;
      gap: 8px
    }

    .hero-card.has-photo .hero-copy {
      color: #fff
    }

    .hero-card.has-photo .hero-copy p {
      max-width: 36ch;
      color: rgba(255, 255, 255, .9)
    }

    .hero-card.has-photo .hero-copy .btn {
      background: #FFFFFF;
      color: #3A222A
    }

    .hero-card.has-photo .hero-copy .btn {
      justify-self: center
    }

    .hero-card.has-photo .hero-art {
      display: none
    }

    @media(min-width:760px) {
      .hero-card.has-photo {
        min-height: 520px
      }
    }

    /* brand + chips */
    .row-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 16px 12px 4px;
      scrollbar-width: none;
      max-width: 1100px;
      margin: 0 auto
    }

    .row-scroll::-webkit-scrollbar {
      display: none
    }

    .pill {
      flex: none;
      padding: 8px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      font-weight: 500;
      font-size: 14px;
      white-space: nowrap;
      min-height: 40px
    }

    .pill[aria-pressed="true"] {
      background: var(--deep);
      border-color: var(--deep);
      color: var(--deep-ink)
    }

    .brand-row .pill {
      direction: ltr
    }

    /* product sections */
    .sec {
      max-width: 1100px;
      margin: 0 auto;
      padding: 22px 12px 4px
    }

    .sec h2 {
      font-family: var(--serif);
      font-size: 30px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 14px
    }

    .res-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap
    }

    .res-head h2 {
      margin: 0
    }

    .active {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px
    }

    @media(min-width:700px) {
      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px
      }
    }

    @media(min-width:1000px) {
      .grid {
        grid-template-columns: repeat(4, minmax(0, 1fr))
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      display: flex;
      flex-direction: column
    }

    .card-img {
      position: relative;
      background: var(--tile);
      aspect-ratio: 1/1.08
    }

    .hit {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 36px 10px 12px
    }

    .hit svg,
    .hit img {
      height: 100%;
      width: auto;
      max-width: 100%
    }

    .tag {
      position: absolute;
      top: 10px;
      inset-inline-end: 10px;
      background: var(--deep);
      color: var(--deep-ink);
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      pointer-events: none;
      z-index: 1
    }

    .tag.soon {
      background: #7A6A60;
      color: #fff
    }

    .add {
      position: absolute;
      bottom: 10px;
      inset-inline-start: 10px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--btn);
      color: var(--btn-ink);
      display: grid;
      place-items: center;
      z-index: 2
    }

    .card-body {
      display: grid;
      gap: 2px;
      padding: 12px 14px 15px;
      text-align: start;
      width: 100%
    }

    .brand-l {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500
    }

    .name {
      font-weight: 500;
      font-size: 14px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 3em
    }

    .prices {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px
    }

    .price {
      color: var(--rose);
      font-weight: 700;
      font-size: 16px
    }

    .old {
      color: var(--muted);
      text-decoration: line-through;
      font-size: 13px
    }

    .is-soon .hit svg,
    .is-soon .hit img {
      opacity: .5
    }

    .is-soon .name {
      color: var(--muted)
    }

    .empty {
      text-align: center;
      padding: 36px 12px;
      color: var(--muted);
      display: grid;
      gap: 14px;
      justify-items: center
    }

    /* reviews */
    .rate {
      position: relative;
      display: inline-block;
      width: max-content;
      justify-self: start;
      direction: ltr;
      unicode-bidi: isolate;
      letter-spacing: 2px;
      line-height: 1;
      font-size: 19px;
      white-space: nowrap;
      vertical-align: middle
    }

    .rate-bg {
      color: var(--sage2)
    }

    .rate-fg {
      position: absolute;
      top: 0;
      left: 0;
      width: var(--p);
      overflow: hidden;
      color: var(--star)
    }

    .rate.sm {
      font-size: 13px;
      letter-spacing: 1px
    }

    .cr {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 20px;
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 2px
    }

    .rv-top {
      display: grid;
      gap: 14px;
      margin-bottom: 18px
    }

    @media(min-width:760px) {
      .rv-top {
        grid-template-columns: 1.25fr 1fr
      }
    }

    .rv-score {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 18px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 18px;
      align-items: center
    }

    .rv-avg {
      font-family: var(--display);
      font-size: 58px;
      line-height: 1;
      font-weight: 600;
      direction: ltr;
      unicode-bidi: isolate
    }

    .rv-meta {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 14px
    }

    .rv-dist {
      grid-column: 1/-1;
      display: grid;
      gap: 7px;
      margin-top: 10px
    }

    .rv-row {
      display: grid;
      grid-template-columns: 36px 1fr 30px;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted)
    }

    .rv-row .n {
      text-align: end
    }

    .rv-bar {
      height: 8px;
      background: var(--sage);
      border-radius: 99px;
      overflow: hidden
    }

    .rv-bar i {
      display: block;
      height: 100%;
      background: var(--bronze);
      border-radius: 99px
    }

    .rv-side {
      background: var(--sage);
      border-radius: 22px;
      padding: 18px;
      display: grid;
      gap: 12px;
      align-content: center
    }

    .rv-side p {
      color: var(--muted)
    }

    .rv-note {
      font-size: 12.5px;
      color: var(--muted);
      border-top: 1px dashed var(--sage2);
      padding-top: 10px
    }

    .rev-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px
    }

    @media(min-width:700px) {
      .rev-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }
    }

    @media(min-width:1000px) {
      .rev-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr))
      }
    }

    .rev {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 16px;
      display: grid;
      gap: 8px;
      align-content: start
    }

    .rev .who {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline
    }

    .rev .who b {
      font-weight: 600
    }

    .rev small {
      color: var(--muted)
    }

    .rev .prod {
      font-size: 12.5px;
      background: var(--sage);
      border-radius: 999px;
      padding: 2px 10px;
      justify-self: start
    }

    .rev p {
      overflow-wrap: anywhere
    }

    .more {
      display: flex;
      justify-content: center;
      margin-top: 16px
    }

    .rv-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 12px 0 20px
    }

    .rv-head h3 {
      font-family: var(--serif);
      font-size: 24px
    }

    .starpick {
      display: flex;
      gap: 2px;
      direction: ltr;
      justify-content: flex-end
    }

    .starpick button {
      width: 48px;
      height: 48px;
      font-size: 36px;
      line-height: 1;
      color: var(--sage2);
      display: grid;
      place-items: center;
      border-radius: 12px
    }

    .starpick button.on {
      color: var(--star)
    }

    /* footer */
    .foot {
      margin-top: 40px;
      background: var(--deep);
      color: var(--deep-ink);
      padding: 30px 16px 96px
    }

    .foot-in {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      gap: 10px
    }

    .foot .logo img {
      width: 52px;
      height: 52px
    }

    .foot .logo span {
      font-size: 28px
    }

    .foot .tagline {
      font-family: var(--display);
      letter-spacing: .3em;
      font-size: 12px;
      opacity: .75
    }

    .foot p {
      opacity: .85;
      max-width: 52ch
    }

    .foot .btn {
      justify-self: start;
      margin-top: 6px
    }

    .foot .adm-link {
      justify-self: start;
      font-size: 12.5px;
      opacity: .6;
      text-decoration: none;
      padding: 10px 0;
      margin-top: 8px
    }

    .foot .adm-link:hover {
      opacity: 1;
      text-decoration: underline
    }

    /* زر المراسلة العائم (إنستقرام) */
    .wa-fab {
      position: fixed;
      left: 14px;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      z-index: 15;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      padding: 0 18px 0 16px;
      border-radius: 999px;
      background: linear-gradient(135deg, #4f5bd5, #962fbf, #d62976, #fa7e1e, #feda75);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, .25)
    }

    /* scrim + drawers + modal */
    .scrim {
      position: fixed;
      inset: 0;
      background: rgba(5, 18, 14, .52);
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s
    }

    .scrim.on {
      opacity: 1;
      pointer-events: auto
    }

    .drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      width: min(430px, 100%);
      background: var(--surface);
      z-index: 40;
      display: flex;
      flex-direction: column;
      visibility: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      transition: transform .3s cubic-bezier(.2, .8, .2, 1), visibility 0s .3s
    }

    .drawer.menu {
      right: 0;
      transform: translateX(100%)
    }

    .drawer.cart {
      left: 0;
      transform: translateX(-100%)
    }

    .drawer.open {
      transform: none;
      visibility: visible;
      transition: transform .3s cubic-bezier(.2, .8, .2, 1), visibility 0s
    }

    .dr-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px 8px 16px;
      border-bottom: 1px solid var(--line)
    }

    .dr-head strong {
      font-size: 17px;
      font-weight: 600
    }

    .dr-head .start {
      display: flex;
      align-items: center;
      gap: 4px
    }

    .dr-body {
      flex: 1;
      overflow-y: auto;
      padding: 6px 16px 18px
    }

    .dr-foot {
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--line);
      background: var(--bg);
      display: grid;
      gap: 10px
    }

    .back svg {
      transform: rotate(0)
    }

    .acc summary {
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 1px solid var(--line)
    }

    .acc summary::-webkit-details-marker {
      display: none
    }

    .acc[open] summary svg {
      transform: rotate(180deg)
    }

    .opt {
      display: block;
      width: 100%;
      text-align: start;
      padding: 11px 6px;
      min-height: 44px;
      border-bottom: 1px solid var(--line);
      color: var(--muted)
    }

    .opt.strong {
      font-weight: 600;
      color: var(--ink);
      padding: 15px 0
    }

    .ship {
      padding: 14px 0 8px;
      font-size: 14px;
      text-align: center
    }

    .bar {
      height: 10px;
      border-radius: 99px;
      background: var(--sage);
      position: relative;
      margin: 18px 16px 8px
    }

    .bar i {
      display: block;
      height: 100%;
      border-radius: 99px;
      background: repeating-linear-gradient(-45deg, var(--bronze) 0 6px, var(--sage2) 6px 12px);
      transition: width .3s
    }

    .truck {
      position: absolute;
      top: 50%;

      const items = cartItems();
      const sub = items.reduce((s, i) => s + i.p.price * i.q, 0);
      let auto = 0, disc = 0, belowMin = false;
      const A0 = CONFIG.auto;
      if (A0 && sub >= A0.min) auto = A0.type === 'percent' ? r3(sub * Math.min(100, A0.value) / 100) : Math.min(A0.value, sub);

        else disc = cp.type === 'percent' ? r3(sub * Math.min(100, cp.value) / 100) : Math.min(cp.value, sub);
      }
      disc = Math.min(disc, sub - auto);
      const after = Math.max(0, sub - auto - disc);
      const free = after >= CONFIG.freeShipping;
      let fee = null;
      if (free) fee = 0;
      else if (city) fee = city === 'عمّان' ? CONFIG.delivery.amman : CONFIG.delivery.other;
      return { items, sub, auto, disc, belowMin, after, free, fee, total: after + (fee || 0) };

    function shipHTML(t) {
      const rem = Math.max(0, CONFIG.freeShipping - t.after);
      const pct = Math.min(100, t.after / CONFIG.freeShipping * 100);
      return `<div class="ship"><p>${rem > 0 ? tr('shipRem', `<b class="num">${fmt(rem)}</b>`) : tr('shipFree')}</p>
    <div class="bar"><i style="width:${pct}%"></i><span class="truck" style="--pct:${pct}%">${ic('truck', 16)}</span></div></div>`;
    }
    function totalsHTML(t, city) {
      const feeTxt = t.fee === null ? tr('feeByCity') : t.fee === 0 ? tr('free') : fmt(t.fee);
      return `<div class="tot">

    <div class="r big"><span>${tr('total')}</span><span class="num">${fmt(t.total)}</span></div></div>`;
    }
