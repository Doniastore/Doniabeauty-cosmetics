    [hidden] {
      display: none !important
    }

    html {
      scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px);
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Readex Pro', Tahoma, system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.65
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer;
      background: none;
      border: 0;
      padding: 0
    }

    a {
      color: inherit
    }

    svg.ic {
      flex: none;
      display: block
    }

    .num {
      direction: ltr;
      unicode-bidi: isolate;
      display: inline-block
    }

    :focus-visible {
      outline: 2px solid var(--bronze);
      outline-offset: 2px
    }

    /* announcement + header */
    .promo {
      background: var(--deep);
      color: var(--deep-ink);
      text-align: center;
      font-size: 13px;
      padding: 8px 12px
    }

    .hdr {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 20;
      background: var(--bg);
      border-bottom: 1px solid var(--line)
    }

    .hdr-in {
      position: relative
    }

    .hdr-in {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 6px 10px;
      max-width: 1100px;
      margin: 0 auto
    }

    .hdr-start {
      display: flex
    }

    .hdr-end {
      display: flex;
      justify-content: flex-end
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      direction: ltr
    }

    .logo img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: block;
      box-shadow: 0 0 0 1px var(--line)
    }

    .logo span {
      font-family: var(--display);
      font-weight: 600;
      font-size: 24px;
      letter-spacing: .24em;
      padding-inline-start: .24em;
      line-height: 1
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      position: relative
    }

    .icon-btn:hover {
      background: var(--sage)
    }

    .badge {
      position: absolute;
      top: 3px;
      inset-inline-end: 1px;
      min-width: 19px;
      height: 19px;
      padding: 0 5px;
      border-radius: 10px;
      background: var(--rose);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      display: grid;
      place-items: center;
      line-height: 1
    }

    .badge.bump {
      animation: bump .35s
    }

    @keyframes bump {
      50% {
        transform: scale(1.35)
      }
    }

    .searchbar {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 12px 10px
    }

    .dnav {
      position: absolute;
      top: calc(100% + 8px);
      inset-inline-start: 10px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 210px;
      max-width: calc(100vw - 20px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 8px;
      box-shadow: 0 14px 32px rgba(74, 44, 29, .16);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px);
      transition: opacity .16s ease, transform .16s ease, visibility .16s
    }

    .dnav.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0)
    }

    .dlink {
      display: block;
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 500;
      font-size: 15px;
      color: var(--ink);
      text-decoration: none;
      white-space: nowrap;
      text-align: start
    }

    .dlink:hover {
      background: var(--sage)
    }

    @media(min-width:900px) {
      .hdr-in {
        grid-template-columns: auto 1fr auto auto;
        gap: 6px;
        padding: 8px 16px
      }

      .hdr-start,
      .hdr-end {
        display: contents
      }

      #btnMenu {
        order: 0
      }

      .logo {
        order: 1
      }

      #btnSearch {
        order: 3
      }

      #btnCart {
        order: 4
      }

      .logo img {
        width: 46px;
        height: 46px
      }
    }

    /* buttons + inputs */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 50px;
      padding: 0 26px;
      border-radius: 999px;
      background: var(--btn);
      color: var(--btn-ink);
      font-weight: 600;
      text-decoration: none;
      text-align: center
    }

    .btn[disabled] {
      opacity: .5;
      cursor: not-allowed
    }

    .btn.wa {
      background: var(--wa);
      color: #fff
    }

    .btn.ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line)
    }

    .btn.block {
      width: 100%
    }

    .input {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      padding: 0 14px;
      font-size: 16px
    }

    textarea.input {
      padding: 12px 14px;
      min-height: 78px;
      resize: vertical
    }

    /* hero */
    .hero {
      max-width: 1100px;
      margin: 14px auto 0;
      padding: 0 12px
    }

    .hero-card {
      background: var(--hero-bg);
      color: var(--ink);
      border-radius: 28px;
      position: relative;
      padding: 28px 22px 0;
      overflow: hidden;
      display: grid;
      gap: 10px
    }

    .hero h1 {
      font-family: var(--serif);
      font-size: clamp(32px, 8.6vw, 54px);
      line-height: 1.25;
      font-weight: 700
    }

    .hero p {
      color: var(--muted);
      max-width: 34ch
    }

    .hero .btn {
      justify-self: start;
      margin-top: 8px
    }

    .hero-art {
      position: relative;
      height: 235px;
      margin-top: 6px
    }

    .halo {
      position: absolute;
      width: 290px;
      height: 290px;
      border-radius: 50%;
      background: var(--halo);
      left: 50%;
      bottom: -62px;
      transform: translateX(-50%)
    }

    .halo::after {
      content: '';
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      border: 1.5px solid var(--bronze);
      opacity: .55
    }

    .hero-art svg {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: auto
    }

    .a1 {
      height: 72%;
      transform: translateX(-96%) rotate(-5deg);
      transform-origin: bottom
    }

    .a2 {
      height: 97%;
      transform: translateX(-50%)
    }

    .a3 {
      height: 72%;
      transform: translateX(-4%) rotate(5deg);
      transform-origin: bottom
    }

    @media(min-width:760px) {
      .hero-card {
        grid-template-columns: 1.05fr 1fr;
        align-items: center;
        padding: 44px 52px 0
      }

      .hero-art {
        height: 360px
      }

      .halo {
        width: 450px;
        height: 450px;
        bottom: -95px
      }
    }

    /* photos (تظهر لما تضاف صور حقيقية) */
    .ph {
      height: 100%;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      mix-blend-mode: multiply;
      display: block
    }

    .hero-card.has-photo {
      padding: 0;
      display: block;
      min-height: min(118vw, 600px)
    }

    .hero-card.has-photo .hero-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .hero-card.has-photo .hero-copy {
      position: absolute;
      inset-inline: 0;
      bottom: 0;
      padding: 90px 22px 28px;
      background: linear-gradient(to top, rgba(28, 18, 12, .7), rgba(28, 18, 12, 0));
      display: grid;
      justify-items: center;
      text-align: center;
      gap: 8px
    }

    .hero-card.has-photo .hero-copy {
      color: #fff
    }

    .hero-card.has-photo .hero-copy p {
      max-width: 36ch;
      color: rgba(255, 255, 255, .9)
    }

    .hero-card.has-photo .hero-copy .btn {
      background: #F6EEE8;
      color: #4A2C1D
    }

    .hero-card.has-photo .hero-copy .btn {
      justify-self: center
    }

    .hero-card.has-photo .hero-art {
      display: none
    }

    @media(min-width:760px) {
      .hero-card.has-photo {
        min-height: 520px
      }
    }

    /* brand + chips */
    .row-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 16px 12px 4px;
      scrollbar-width: none;
      max-width: 1100px;
      margin: 0 auto
    }

    .row-scroll::-webkit-scrollbar {
      display: none
    }

    .pill {
      flex: none;
      padding: 8px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      font-weight: 500;
      font-size: 14px;
      white-space: nowrap;
      min-height: 40px
    }

    .pill[aria-pressed="true"] {
      background: var(--deep);
      border-color: var(--deep);
      color: var(--deep-ink)
    }

    .brand-row .pill {
      direction: ltr
    }

    /* product sections */
    .sec {
      max-width: 1100px;
      margin: 0 auto;
      padding: 22px 12px 4px
    }

    .sec h2 {
      font-family: var(--serif);
      font-size: 30px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 14px
    }

    .res-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap
    }

    .res-head h2 {
      margin: 0
    }

    .active {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px
    }

    @media(min-width:700px) {
      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px
      }
    }

    @media(min-width:1000px) {
      .grid {
        grid-template-columns: repeat(4, minmax(0, 1fr))
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      display: flex;
      flex-direction: column
    }

    .card-img {
      position: relative;
      background: var(--tile);
      aspect-ratio: 1/1.08
    }

    .hit {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 36px 10px 12px
    }

    .hit svg,
    .hit img {
      height: 100%;
      width: auto;
      max-width: 100%
    }

    .tag {
      position: absolute;
      top: 10px;
      inset-inline-end: 10px;
      background: var(--deep);
      color: var(--deep-ink);
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      pointer-events: none;
      z-index: 1
    }

    .tag.soon {
      background: #7A6A60;
      color: #fff
    }

    .add {
      position: absolute;
      bottom: 10px;
      inset-inline-start: 10px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--btn);
      color: var(--btn-ink);
      display: grid;
      place-items: center;
      z-index: 2
    }

    .card-body {
      display: grid;
      gap: 2px;
      padding: 12px 14px 15px;
      text-align: start;
      width: 100%
    }

    .brand-l {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500
    }

    .name {
      font-weight: 500;
      font-size: 14px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 3em
    }

    .prices {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px
    }

    .price {
      color: var(--rose);
      font-weight: 700;
      font-size: 16px
    }

    .old {
      color: var(--muted);
      text-decoration: line-through;
      font-size: 13px
    }

    .is-soon .hit svg,
    .is-soon .hit img {
      opacity: .5
    }

    .is-soon .name {
      color: var(--muted)
    }

    .empty {
      text-align: center;
      padding: 36px 12px;
      color: var(--muted);
      display: grid;
      gap: 14px;
      justify-items: center
    }

    /* reviews */
    .rate {
      position: relative;
      display: inline-block;
      width: max-content;
      justify-self: start;
      direction: ltr;
      unicode-bidi: isolate;
      letter-spacing: 2px;
      line-height: 1;
      font-size: 19px;
      white-space: nowrap;
      vertical-align: middle
    }

    .rate-bg {
      color: var(--sage2)
    }

    .rate-fg {
      position: absolute;
      top: 0;
      left: 0;
      width: var(--p);
      overflow: hidden;
      color: var(--star)
    }

    .rate.sm {
      font-size: 13px;
      letter-spacing: 1px
    }

    .cr {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 20px;
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 2px
    }

    .rv-top {
      display: grid;
      gap: 14px;
      margin-bottom: 18px
    }

    @media(min-width:760px) {
      .rv-top {
        grid-template-columns: 1.25fr 1fr
      }
    }

    .rv-score {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 18px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 18px;
      align-items: center
    }

    .rv-avg {
      font-family: var(--display);
      font-size: 58px;
      line-height: 1;
      font-weight: 600;
      direction: ltr;
      unicode-bidi: isolate
    }

    .rv-meta {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 14px
    }

    .rv-dist {
      grid-column: 1/-1;
      display: grid;
      gap: 7px;
      margin-top: 10px
    }

    .rv-row {
      display: grid;
      grid-template-columns: 36px 1fr 30px;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted)
    }

    .rv-row .n {
      text-align: end
    }

    .rv-bar {
      height: 8px;
      background: var(--sage);
      border-radius: 99px;
      overflow: hidden
    }

    .rv-bar i {
      display: block;
      height: 100%;
      background: var(--bronze);
      border-radius: 99px
    }

    .rv-side {
      background: var(--sage);
      border-radius: 22px;
      padding: 18px;
      display: grid;
      gap: 12px;
      align-content: center
    }

    .rv-side p {
      color: var(--muted)
    }

    .rv-note {
      font-size: 12.5px;
      color: var(--muted);
      border-top: 1px dashed var(--sage2);
      padding-top: 10px
    }

    .rev-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px
    }

    @media(min-width:700px) {
      .rev-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }
    }

    @media(min-width:1000px) {
      .rev-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr))
      }
    }

    .rev {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 16px;
      display: grid;
      gap: 8px;
      align-content: start
    }

    .rev .who {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline
    }

    .rev .who b {
      font-weight: 600
    }

    .rev small {
      color: var(--muted)
    }

    .rev .prod {
      font-size: 12.5px;
      background: var(--sage);
      border-radius: 999px;
      padding: 2px 10px;
      justify-self: start
    }

    .rev p {
      overflow-wrap: anywhere
    }

    .more {
      display: flex;
      justify-content: center;
      margin-top: 16px
    }

    .rv-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 12px 0 20px
    }

    .rv-head h3 {
      font-family: var(--serif);
      font-size: 24px
    }

    .starpick {
      display: flex;
      gap: 2px;
      direction: ltr;
      justify-content: flex-end
    }

    .starpick button {
      width: 48px;
      height: 48px;
      font-size: 36px;
      line-height: 1;
      color: var(--sage2);
      display: grid;
      place-items: center;
      border-radius: 12px
    }

    .starpick button.on {
      color: var(--star)
    }

    /* footer */
    .foot {
      margin-top: 40px;
      background: var(--deep);
      color: var(--deep-ink);
      padding: 30px 16px 96px
    }

    .foot-in {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      gap: 10px
    }

    .foot .logo img {
      width: 52px;
      height: 52px
    }

    .foot .logo span {
      font-size: 28px
    }

    .foot .tagline {
      font-family: var(--display);
      letter-spacing: .3em;
      font-size: 12px;
      opacity: .75
    }

    .foot p {
      opacity: .85;
      max-width: 52ch
    }

    .foot .btn {
      justify-self: start;
      margin-top: 6px
    }

    .foot .adm-link {
      justify-self: start;
      font-size: 12.5px;
      opacity: .6;
      text-decoration: none;
      padding: 10px 0;
      margin-top: 8px
    }

    .foot .adm-link:hover {
      opacity: 1;
      text-decoration: underline
    }

    /* whatsapp fab */
    .wa-fab {
      position: fixed;
      left: 14px;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      z-index: 15;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      padding: 0 18px 0 16px;
      border-radius: 999px;
      background: var(--wa);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, .25)
    }

    /* scrim + drawers + modal */
    .scrim {
      position: fixed;
      inset: 0;
      background: rgba(5, 18, 14, .52);
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s
    }

    .scrim.on {
      opacity: 1;
      pointer-events: auto
    }

    .drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      width: min(430px, 100%);
      background: var(--surface);
      z-index: 40;
      display: flex;
      flex-direction: column;
      visibility: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      transition: transform .3s cubic-bezier(.2, .8, .2, 1), visibility 0s .3s
    }

    .drawer.menu {
      right: 0;
      transform: translateX(100%)
    }

    .drawer.cart {
      left: 0;
      transform: translateX(-100%)
    }

    .drawer.open {
      transform: none;
      visibility: visible;
      transition: transform .3s cubic-bezier(.2, .8, .2, 1), visibility 0s
    }

    .dr-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px 8px 16px;
      border-bottom: 1px solid var(--line)
    }

    .dr-head strong {
      font-size: 17px;
      font-weight: 600
    }

    .dr-head .start {
      display: flex;
      align-items: center;
      gap: 4px
    }

    .dr-body {
      flex: 1;
      overflow-y: auto;
      padding: 6px 16px 18px
    }

    .dr-foot {
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--line);
      background: var(--bg);
      display: grid;
      gap: 10px
    }

    .back svg {
      transform: rotate(0)
    }

    .acc summary {
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 1px solid var(--line)
    }

    .acc summary::-webkit-details-marker {
      display: none
    }

    .acc[open] summary svg {
      transform: rotate(180deg)
    }

    .opt {
      display: block;
      width: 100%;
      text-align: start;
      padding: 11px 6px;
      min-height: 44px;
      border-bottom: 1px solid var(--line);
      color: var(--muted)
    }

    .opt.strong {
      font-weight: 600;
      color: var(--ink);
      padding: 15px 0
    }

    .ship {
      padding: 14px 0 8px;
      font-size: 14px;
      text-align: center
    }

    .bar {
      height: 10px;
      border-radius: 99px;
      background: var(--sage);
      position: relative;
      margin: 18px 16px 8px
    }

    .bar i {
      display: block;
      height: 100%;
      border-radius: 99px;
      background: repeating-linear-gradient(-45deg, var(--bronze) 0 6px, var(--sage2) 6px 12px);
      transition: width .3s
    }

    .truck {
      position: absolute;
      top: 50%;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--surface);

    function pickLang() {

    function applyStatic() {
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n); });

    /* الصور الحقيقية: بتنضاف هون (data URI). لو فاضية بتظهر الرسومات */

    const byId = id => PRODUCTS.find(p => p.id === id);

    const ICONS = {

      trash: '<path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/>',

      check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',

    };
    const ic = (n, s = 22) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

    /* رسمة المنتج (SVG) */
    function art(p) {

      const swatch = `<ellipse cx="132" cy="152" rx="56" ry="24" transform="rotate(-28 132 152)" fill="${c.swatch}" opacity=".6"/><ellipse cx="150" cy="128" rx="26" ry="11" transform="rotate(-28 150 128)" fill="${c.swatch}"/>`;

      if (p.shape === 'tube') {
        g = `<rect x="76" y="30" width="48" height="9" rx="2" fill="${c.accent}"/>

    <text transform="translate(106 168) rotate(-90)" font-size="11" font-weight="600" fill="${t}" style="direction:ltr">${b}</text>`;

    <rect x="84" y="28" width="34" height="9" rx="4" fill="${c.cap}"/>

    <rect x="80" y="128" width="40" height="56" rx="3" fill="#fff" opacity=".93"/>

      } else {
        g = `<rect x="90" y="22" width="20" height="46" rx="10" fill="${c.cap}"/>

    /* ====================== الحالة ====================== */
    const state = { catStatus: ONLINE ? 'loading' : 'ok', reviews: [], revStatus: 'loading', revFilter: '', revShown: 6, rv: { rating: 0 }, pstats: {}, q: '', type: '', skin: '', concern: '', brand: '', cart: {}, coupon: null, view: 'cart', qty: 1, openId: null, form: {}, order: null, modal: '' };
    const KEY = 'donia_cart_v1';
    function loadCart() {
      try {
        const raw = JSON.parse(localStorage.getItem(KEY) || '{}');
        Object.keys(raw).forEach(id => { if (/^[\w-]{1,40}$/.test(id) && raw[id] > 0) state.cart[id] = Math.min(20, +raw[id] || 0); });
      } catch (e) { }
    }
    function saveCart() { try { localStorage.setItem(KEY, JSON.stringify(state.cart)); } catch (e) { } }
    function pruneCart() {
      let ch = false;
      Object.keys(state.cart).forEach(id => { const p = byId(id); if (!p || p.soon) { delete state.cart[id]; ch = true; } });
      if (ch) saveCart();
    }
    const cartItems = () => Object.keys(state.cart).filter(id => byId(id)).map(id => ({ p: byId(id), q: state.cart[id] }));
    const cartCount = () => cartItems().reduce((a, i) => a + i.q, 0);

    const r3 = n => Math.round(n * 1000) / 1000;
    function totals(city) {
      const items = cartItems();
      const sub = items.reduce((s, i) => s + i.p.price * i.q, 0);
      let auto = 0, disc = 0, belowMin = false;
      const A0 = CONFIG.auto;
      if (A0 && sub >= A0.min) auto = A0.type === 'percent' ? r3(sub * Math.min(100, A0.value) / 100) : Math.min(A0.value, sub);
      if (state.coupon) {
        const cp = CONFIG.coupons[state.coupon];
        if (!cp) state.coupon = null;
        else if (cp.min && sub < cp.min) belowMin = true;
        else disc = cp.type === 'percent' ? r3(sub * Math.min(100, cp.value) / 100) : Math.min(cp.value, sub);
      }
      disc = Math.min(disc, sub - auto);
      const after = Math.max(0, sub - auto - disc);
      const free = after >= CONFIG.freeShipping;
      let fee = null;
      if (free) fee = 0;
      else if (city) fee = city === 'عمّان' ? CONFIG.delivery.amman : CONFIG.delivery.other;
      return { items, sub, auto, disc, belowMin, after, free, fee, total: after + (fee || 0) };
    }
    function autoHint(t) {
      const a = CONFIG.auto;
      if (!a || t.sub >= a.min || !t.items.length) return '';
      const lab = autoLabel();
      return `<p class="hint" style="text-align:center;margin:-2px 0 8px">${tr('autoHint', `<b class="num">${fmt(a.min - t.sub)}</b>`, a.type === 'percent' ? a.value + '%' : fmt(a.value))}${lab ? ' (' + esc(lab) + ')' : ''}</p>`;
    }

    /* ====================== واجهة عامة ====================== */

    /* ====================== المنتجات ====================== */

  </article>`;
    }
    const isFiltering = () => state.q || state.type || state.skin || state.concern || state.brand;

      if (!PRODUCTS.length) { box.innerHTML = `<div class="sec"><div class="empty"><p>${tr('noProducts')}</p></div></div>`; return; }
      if (!isFiltering()) {

    /* ====================== السلة والدفع ====================== */
    function shipHTML(t) {
      const rem = Math.max(0, CONFIG.freeShipping - t.after);
      const pct = Math.min(100, t.after / CONFIG.freeShipping * 100);
      return `<div class="ship"><p>${rem > 0 ? tr('shipRem', `<b class="num">${fmt(rem)}</b>`) : tr('shipFree')}</p>
    <div class="bar"><i style="width:${pct}%"></i><span class="truck" style="--pct:${pct}%">${ic('truck', 16)}</span></div></div>`;
    }
    function totalsHTML(t, city) {
      const feeTxt = t.fee === null ? tr('feeByCity') : t.fee === 0 ? tr('free') : fmt(t.fee);
      return `<div class="tot">
    <div class="r"><span>${tr('subtotal')}</span><span class="num">${fmt(t.sub)}</span></div>
    ${t.auto > 0 ? `<div class="r disc"><span>${tr('discAuto', esc(autoLabel()))}</span><span class="num">- ${fmt(t.auto)}</span></div>` : ''}
    ${t.disc > 0 ? `<div class="r disc"><span>${tr('discCoupon', state.coupon)}</span><span class="num">- ${fmt(t.disc)}</span></div>` : ''}
    <div class="r"><span>${tr('delivery')}</span><span class="${t.fee === null ? '' : 'num'}">${feeTxt}</span></div>
    <div class="r big"><span>${tr('total')}</span><span class="num">${fmt(t.total)}</span></div></div>`;
    }
    function renderCart() {
      const d = $('#cartDrawer');
      const v = state.view, n = cartCount();
      const titles = { cart: tr('cartTitle', n), checkout: tr('checkoutTitle'), done: tr('doneTitle'), fail: tr('failTitle') };
      const back = v === 'checkout' ? `<button class="icon-btn back" data-act="back" aria-label="${tr('backCart')}">${ic('fwd')}</button>` : '';
      let body = '', foot = '';
      const t = totals(state.form.city);

      if (v === 'cart') {
        if (!t.items.length) {
          body = `<div class="empty" style="padding-top:60px">${ic('bag', 44)}<p>${tr('cartEmpty')}</p><button class="btn" data-act="close-all">${tr('browse')}</button></div>`;
        } else {
          const cmsg = state.coupon ? (t.belowMin ? `<div class="cmsg bad">${tr('cpnMin', state.coupon, fmt(CONFIG.coupons[state.coupon].min))}</div>` : `<div class="cmsg ok">${tr('cpnOk', state.coupon)}</div>`) : '<div class="cmsg" id="cmsg"></div>';
          body = shipHTML(t) + autoHint(t) + t.items.map(({ p, q }) => `<div class="line"><div class="thumb">${pic(p)}</div><div>
          <div class="l-top"><span class="l-name">${pName(p)}</span><button class="del" data-del="${p.id}" aria-label="${tr('removeAria', pName(p))}">${ic('trash', 19)}</button></div>
          <div class="l-bot"><div class="qty"><button data-dec="${p.id}" aria-label="${tr('dec')}">${ic('minus', 18)}</button><span>${q}</span><button data-inc="${p.id}" aria-label="${tr('inc')}">${ic('plus', 18)}</button></div>
          <div class="prices" style="margin:0"><span class="price num">${fmt(p.price * q)}</span>${p.old > p.price ? `<span class="old num">${fmt(p.old * q)}</span>` : ''}</div></div></div></div>`).join('') +
            `<div class="coupon"><input class="input" id="cpn" placeholder="${tr('cpnPh')}" autocomplete="off" value="${state.coupon || ''}"><button class="btn ghost" data-act="apply">${tr('apply')}</button></div>${cmsg}` + totalsHTML(t);
          foot = `<button class="btn block" data-act="checkout">${tr('checkoutTitle')} - <span class="num">${fmt(t.total)}</span></button>`;
        }
      } else if (v === 'checkout') {
        const f = state.form, val = k => (f[k] || '').replace(/"/g, '&quot;');
        const F = (id, label, inner) => `<div class="field"><label for="${id}">${label}</label>${inner}<div class="err" id="e-${id}"></div></div>`;
        body = `<details class="sum"><summary><span>${tr('summary')}</span><span class="num" id="sumTotal">${fmt(t.total)}</span></summary><div class="in" id="sumBox"></div></details>
    <div class="form">
      <h3>${tr('formTitle')}</h3>
      <div class="two">
        ${F('fn', tr('fn'), `<input class="input" id="fn" data-f="fn" autocomplete="given-name" value="${val('fn')}">`)}
        ${F('ln', tr('ln'), `<input class="input" id="ln" data-f="ln" autocomplete="family-name" value="${val('ln')}">`)}
      </div>
      ${F('phone', tr('phone'), `<input class="input ltr-txt" id="phone" data-f="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="07XXXXXXXX" value="${val('phone')}">`)}
      ${F('city', tr('city'), `<select class="input" id="city" data-f="city"><option value="">${tr('selCity')}</option>${CITIES.map(c => `<option value="${c}"${f.city === c ? ' selected' : ''}>${cityLbl(c)}</option>`).join('')}</select>`)}
      ${F('area', tr('area'), `<input class="input" id="area" data-f="area" value="${val('area')}">`)}
      ${F('addr', tr('addr'), `<textarea class="input" id="addr" data-f="addr" placeholder="${tr('addrPh')}">${val('addr')}</textarea>`)}
      ${F('note', tr('note'), `<input class="input" id="note" data-f="note" value="${val('note')}">`)}
      <input type="text" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0;height:0;width:0">
      <h3>${tr('payTitle')}</h3>
      <div class="pay"><i></i><span>${tr('cod')}</span></div>
    </div>`;
        foot = `<button class="btn block" data-act="submit">${tr('submitBtn')} - <span class="num" id="subBtnTotal">${fmt(t.total)}</span></button>`;
      } else if (v === 'done') {
        body = `<div class="center"><div class="ok-ic">${ic('check', 30)}</div><h3>${tr('doneH')}</h3>
      <p>${tr('doneP', state.order.no)}</p></div>
      <div class="msg" id="msg" dir="auto"></div>${ONLINE ? '' : `<p class="hint" style="margin-top:10px">${tr('demoHint')}</p>`}`;
        foot = `<a class="btn wa block" target="_blank" rel="noopener" href="https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(tr('waHello', state.order.no))}">${ic('chat', 20)} ${tr('waChat')}</a>
      <button class="btn ghost block" data-act="close-all">${tr('backStore')}</button>`;
      } else if (v === 'fail') {
        body = `<div class="center"><div class="ok-ic" style="color:var(--rose)">${ic('close', 30)}</div><h3>${tr('failH')}</h3>
      <p>${tr('failP')}</p></div><div class="msg" id="msg" dir="auto"></div>`;
        foot = `<a class="btn wa block" id="waSend" target="_blank" rel="noopener" href="${state.order.link}">${ic('chat', 20)} ${tr('sendWa')}</a>
      <div class="two"><button class="btn ghost" data-act="copy">${tr('copyOrder')}</button><button class="btn ghost" data-act="sent">${tr('sentOrder')}</button></div>
      <button class="btn ghost block" data-act="checkout">${tr('retry')}</button>`;
      }

      d.innerHTML = `<div class="dr-head"><div class="start">${back}<strong>${titles[v]}</strong></div><button class="icon-btn" data-act="close-all" aria-label="${tr('close')}">${ic('close')}</button></div>
    <div class="dr-body" id="cartBody">${body}</div>${foot ? `<div class="dr-foot" id="cartFoot">${foot}</div>` : ''}`;
      if (v === 'checkout') updateSummary();
      if (v === 'done' || v === 'fail') $('#msg').textContent = state.order.msg;
    }
    function updateSummary() {
      const t = totals(state.form.city);
      const box = $('#sumBox'); if (!box) return;
      box.innerHTML = t.items.map(({ p, q }) => `<div class="it"><span>${p.ar} × ${q}</span><span class="num">${fmt(p.price * q)}</span></div>`).join('') + totalsHTML(t);
      $('#sumTotal').textContent = fmt(t.total);
      const s = $('#subBtnTotal'); if (s) s.textContent = fmt(t.total);
    }
    function openCart(view) {
      state.view = view || 'cart'; renderCart(); openDrawer('#cartDrawer');
    }

    /* التحقق وإرسال الطلب */
    const PHONE = /^(?:\+?962|0)?7[789]\d{7}$/;
    function normPhone(v) { return v.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[\s\-()]/g, ''); }
    function validate() {
      const f = state.form, e = {};
      if (!(f.fn || '').trim()) e.fn = tr('vFn');
      if (!(f.ln || '').trim()) e.ln = tr('vLn');
      if (!PHONE.test(normPhone(f.phone || ''))) e.phone = tr('vPhone');
      if (!f.city) e.city = tr('vCity');
      if (!(f.area || '').trim()) e.area = tr('vArea');
      if (!(f.addr || '').trim()) e.addr = tr('vAddr');
      ['fn', 'ln', 'phone', 'city', 'area', 'addr'].forEach(k => {
        const el = $('#e-' + k), inp = $('#' + k);
        if (el) el.textContent = e[k] || '';
        if (inp) inp.classList.toggle('bad', !!e[k]);
      });
      const first = Object.keys(e)[0];
      if (first) { const inp = $('#' + first); inp.scrollIntoView({ block: 'center' }); inp.focus(); return false; }
      return true;
    }
    const iso = (x, raw) => '\u2066' + (raw ? x : fmt(x)) + '\u2069';
    const ORD = {
      async create(o) {
        if (!ONLINE) {
          let all = []; try { all = JSON.parse(getLS('donia_orders_v1') || '[]'); } catch (e) { }
          all.push(Object.assign({ id: 'l' + Date.now() }, o));
          localStorage.setItem('donia_orders_v1', JSON.stringify(all)); return;
        }
        const S = v => ({ stringValue: String(v) }), N = v => ({ doubleValue: Number(v) });
        const res = await fetch(`${REV.base()}/orders?key=${REV.key()}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fields: {
              orderNo: S(o.orderNo), name: S(o.name), phone: S(o.phone), city: S(o.city), area: S(o.area), address: S(o.address), note: S(o.note),
              itemsJson: S(o.itemsJson), subtotal: N(o.subtotal), discount: N(o.discount), delivery: N(o.delivery), total: N(o.total),
              coupon: S(o.coupon), createdAt: { timestampValue: new Date(o.createdAt).toISOString() }, status: S('new')
            }
          })
        });
        if (!res.ok) throw await httpErr(res, 'order');
      }
    };
    async function submitOrder() {
      if (state.submitting) return;
      if (!validate()) return;
      if ($('#hp') && $('#hp').value) return;
      if (Date.now() - (+getLS('donia_ord_last') || 0) < 20000) return toast(tr('waitOrder'));
      const f = state.form, t = totals(f.city);
      if (!t.items.length) return;
      const no = 'DN-' + String(Math.floor(1000 + Math.random() * 9000));
      const lab = autoLabel();
      const lines = [
        `${tr('ordNew')} ${no}`, '',
        `${tr('ordName')}: ${f.fn.trim()} ${f.ln.trim()}`,
        `${tr('ordPhone')}: ${normPhone(f.phone)}`,
        `${tr('ordCity')}: ${cityLbl(f.city)} - ${f.area.trim()}`,
        `${tr('ordAddr')}: ${f.addr.trim()}`,
        tr('ordPay'), '',
        tr('ordItems'),
        ...t.items.map(({ p, q }) => `- ${p.brand} ${pName(p)} × ${q} = ${iso(p.price * q)}`), '',
        `${tr('ordSub')}: ${iso(t.sub)}`,
        ...(t.auto > 0 ? [`${tr('discAuto', lab)}: -${iso(t.auto)}`] : []),
        ...(t.disc > 0 ? [`${tr('ordCpn', state.coupon)}: -${iso(t.disc)}`] : []),
        `${tr('ordDelivery')}: ${t.fee === 0 ? tr('free') : iso(t.fee)}`,
        `${tr('ordTotal')}: ${iso(t.total)}`,
        ...((f.note || '').trim() ? ['', `${tr('ordNote')}: ${f.note.trim()}`] : [])
      ];
      const msg = lines.join('\n');
      const order = {
        orderNo: no, name: `${f.fn.trim()} ${f.ln.trim()}`, phone: normPhone(f.phone), city: f.city, area: f.area.trim(),
        address: f.addr.trim(), note: (f.note || '').trim(),
        itemsJson: JSON.stringify({ items: t.items.map(({ p, q }) => ({ id: p.id, b: p.brand, n: p.ar, q, pr: p.price })), auto: t.auto, autoLabel: CONFIG.auto ? CONFIG.auto.label : '', couponDisc: t.disc }),
        subtotal: t.sub, discount: r3(t.auto + t.disc), delivery: t.fee || 0, total: t.total,
        coupon: state.coupon && !t.belowMin ? state.coupon : '', createdAt: Date.now(), status: 'new'
      };
      state.order = { no, msg, link: `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}` };
      const btn = document.querySelector('[data-act="submit"]');
      state.submitting = true; if (btn) { btn.disabled = true; btn.textContent = tr('sending'); }
      try {
        await ORD.create(order);
        setLS('donia_ord_last', String(Date.now()));
        state.cart = {}; state.coupon = null; state.form.note = ''; saveCart(); updateBadge();
        state.view = 'done';
      } catch (e) { console.error('[DONIA] order:', e); state.view = 'fail'; }
      state.submitting = false; renderCart(); $('#cartBody').scrollTop = 0;
    }

    /* ====================== الكتالوج والإعدادات (من لوحة التحكم) ====================== */
    const DEBUG = /[?&]debug(=|&|$)/.test(location.search);
    async function httpErr(res, what) {
      let d = '';
      try { const j = await res.json(); const e = j.error || (Array.isArray(j) && j[0] && j[0].error) || {}; d = [e.status, e.message].filter(Boolean).join(': '); } catch (x) { }
      return new Error(`${what} ${res.status} ${d}`.trim());
    }
    const num = (v, d = 0) => { const n = parseFloat(v); return Number.isFinite(n) && n >= 0 ? n : d; };
    const clean = t => String(t == null ? '' : t).replace(/[<>"`]/g, '').replace(/\s+/g, ' ').trim();
    const okImg = s => typeof s === 'string' && s.length < 900000 && /^data:image\/(webp|png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(s);
    const okColor = c => typeof c === 'string' && /^#[0-9a-f]{3,8}$/i.test(c);
    const SEC_LABELS = Object.fromEntries(SECTIONS.map(s => [s.key, s.title]));

    function normProduct(r, image) {
      if (!r || typeof r !== 'object') return null;
      const arr = (v, obj) => (Array.isArray(v) ? v : []).filter(k => obj[k]);
      const base = { body: '#F6EEE8', accent: '#8A6350', cap: '#E9D7CB', swatch: '#E4CBBB' };
      const c = Object.assign({}, base);
      if (r.c && typeof r.c === 'object') Object.keys(base).concat('t').forEach(k => { if (okColor(r.c[k])) c[k] = r.c[k]; });
      const p = {
        id: clean(r.id), brand: clean(r.brand), name: clean(r.name), ar: clean(r.ar) || clean(r.name),
        price: num(r.price), old: num(r.old), desc: clean(r.desc), descEn: clean(r.descEn),
        type: TYPES[r.type] ? r.type : Object.keys(TYPES)[0],
        skin: arr(r.skin, SKINS), concern: arr(r.concern, CONCERNS), sections: arr(r.sections, SEC_LABELS),
        soon: !!r.soon, visible: r.visible !== false, ord: num(r.ord),
        shape: ['tube', 'pump', 'dropper'].includes(r.shape) ? r.shape : 'tube', c,
        image: okImg(image) ? image : ''
      };
      if (!p.id || !/^[\w-]{1,40}$/.test(p.id) || !p.ar || !(p.price > 0)) return null;
      if (p.old && p.old <= p.price) p.old = 0;
      return p;
    }
    function setProducts(list) {
      PRODUCTS.length = 0;
      list.sort((a, b) => a.ord - b.ord).forEach(p => PRODUCTS.push(p));
    }
    const DEFAULT_SETTINGS = () => ({
      whatsapp: CONFIG.whatsapp, instagram: CONFIG.instagram, freeShipping: CONFIG.freeShipping,
      deliveryAmman: CONFIG.delivery.amman, deliveryOther: CONFIG.delivery.other,
      promoText: '', promoTextEn: '', heroImage: '',
      coupons: Object.entries(CONFIG.coupons).map(([code, c]) => ({ code, type: c.type, value: c.value, min: c.min || 0, active: true })),
      auto: { on: false, type: 'percent', value: 10, min: 0, label: '', labelEn: '' }
    });
    const BASE_SETTINGS = DEFAULT_SETTINGS();
    function mergeSettings(s) {
      const d = DEFAULT_SETTINGS();
      if (!s || typeof s !== 'object') return d;
      return Object.assign(d, s, { auto: Object.assign(d.auto, s.auto || {}), coupons: Array.isArray(s.coupons) ? s.coupons : d.coupons });
    }
    function setWaLinks() {
      const wa = `https://wa.me/${CONFIG.whatsapp}`;
      $('#waFab').href = wa; $('#footWa').href = wa;
      if (CONFIG.instagram) { $('#igFab').href = CONFIG.instagram; $('#footIg').href = CONFIG.instagram; }
    }
    function applyHero() {
      const hc = $('#heroCard'); if (!hc) return;
      const old = hc.querySelector('.hero-photo'); if (old) old.remove();
      hc.classList.toggle('has-photo', !!IMAGES.hero);
      if (IMAGES.hero) hc.insertAdjacentHTML('afterbegin', `<img class="hero-photo" src="${IMAGES.hero}" alt="">`);
    }
    function applySettings(raw) {
      const s = mergeSettings(raw);
      const wa = String(s.whatsapp || '').replace(/\D/g, '');
      if (wa.length >= 9) CONFIG.whatsapp = wa;
      const ig = String(s.instagram || '').trim();
      if (ig) CONFIG.instagram = ig;
      CONFIG.freeShipping = num(s.freeShipping, CONFIG.freeShipping);
      CONFIG.delivery = { amman: num(s.deliveryAmman, CONFIG.delivery.amman), other: num(s.deliveryOther, CONFIG.delivery.other) };
      CONFIG.coupons = {};
      s.coupons.forEach(c => {
        const code = String(c.code || '').trim().toUpperCase();
        if (code && c.active !== false && (c.type === 'percent' || c.type === 'fixed') && num(c.value) > 0)
          CONFIG.coupons[code] = { type: c.type, value: num(c.value), min: num(c.min) };
      });
      CONFIG.auto = s.auto && s.auto.on && num(s.auto.value) > 0
        ? { type: s.auto.type === 'fixed' ? 'fixed' : 'percent', value: num(s.auto.value), min: num(s.auto.min), label: clean(s.auto.label), labelEn: clean(s.auto.labelEn) } : null;
      PROMO.ar = clean(s.promoText); PROMO.en = clean(s.promoTextEn); applyPromo();
      IMAGES.hero = okImg(s.heroImage) ? s.heroImage : null;
      applyHero(); setWaLinks();
    }

    /* قراءة الكتالوج: Firestore (REST) أو التخزين المحلي بوضع التجربة */
    const FS = {
      async listProducts() {
        const out = []; let tok = '';
        for (let i = 0; i < 5; i++) {
          const res = await fetch(`${REV.base()}/products?pageSize=200&key=${REV.key()}${tok ? '&pageToken=' + encodeURIComponent(tok) : ''}`);
          if (!res.ok) throw await httpErr(res, 'products');
          const j = await res.json();
          (j.documents || []).forEach(d => {
            try {
              const f = d.fields || {}; const raw = JSON.parse(f.json.stringValue); raw.id = d.name.split('/').pop();
              out.push({ raw, image: (f.image && f.image.stringValue) || '' });
            } catch (e) { }
          });
          tok = j.nextPageToken; if (!tok) break;
        }
        return out;
      },
      async getSettings() {
        const res = await fetch(`${REV.base()}/config/store?key=${REV.key()}`);
        if (res.status === 404) return null;
        if (!res.ok) throw await httpErr(res, 'settings');
        const f = (await res.json()).fields || {};
        const s = JSON.parse(f.json.stringValue); s.heroImage = (f.heroImage && f.heroImage.stringValue) || '';
        return s;
      }
    };
    const LOC = {
      getProducts() { try { const v = JSON.parse(getLS('donia_products_v1') || 'null'); return Array.isArray(v) ? v : null; } catch (e) { return null; } },
      setProducts(list) { localStorage.setItem('donia_products_v1', JSON.stringify(list)); },
      getSettings() { try { return JSON.parse(getLS('donia_settings_v1') || 'null'); } catch (e) { return null; } },
      setSettings(s) { localStorage.setItem('donia_settings_v1', JSON.stringify(s)); }
    };
    async function loadCatalog() {
      if (ONLINE) { state.catStatus = 'loading'; renderProducts(); }
      try {
        const [items, settings] = ONLINE ? await Promise.all([FS.listProducts(), FS.getSettings()]) : [LOC.getProducts(), LOC.getSettings()];
        applySettings(settings);
        if (items !== null) setProducts(items.map(i => normProduct(i.raw, i.image)).filter(p => p && p.visible));
        state.catStatus = 'ok';
      } catch (e) {
        console.error('[DONIA] products:', e); state.catErr = String((e && e.message) || e);
        if (ONLINE) { setProducts([]); state.catStatus = 'error'; }
      }
      pruneCart(); updateBadge(); computeStats(); refresh();
    }

    /* ====================== آراء الزبائن ====================== */
    const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const getLS = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
    const setLS = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { } };
    const cust = n => n === 1 ? 'زبون واحد' : n === 2 ? 'زبونين' : n <= 10 ? n + ' زبائن' : n + ' زبون';
    const rate = (avg, cls = '') => `<span class="rate ${cls}" style="--p:${(avg / 5 * 100).toFixed(1)}%" role="img" aria-label="${tr('outOf5', avg.toFixed(1))}"><span class="rate-bg">★★★★★</span><span class="rate-fg">★★★★★</span></span>`;
    function stats(list) {
      const dist = [0, 0, 0, 0, 0, 0];
      list.forEach(r => dist[r.rating]++);
      const n = list.length;
      return { n, dist, avg: n ? list.reduce((a, r) => a + r.rating, 0) / n : 0 };
    }
    function computeStats() {
      const by = {};
      state.reviews.forEach(r => (by[r.productId] = by[r.productId] || []).push(r));
      state.pstats = {};
      Object.keys(by).forEach(id => { state.pstats[id] = stats(by[id]); });
    }
    function miniRate(id) {
      const st = state.pstats[id];
      return st && st.n ? `${rate(st.avg, 'sm')}<span class="num">${st.avg.toFixed(1)} (${st.n})</span>` : '';
    }

    /* مخزن الآراء: محلي للتجربة، أو Firestore (REST) لما تعبّي إعدادات Firebase */
    const okRev = r => r && typeof r.name === 'string' && typeof r.productId === 'string' && Number.isInteger(r.rating) && r.rating >= 1 && r.rating <= 5 && Number.isFinite(r.createdAt);
    const REV = {
      online() { return !!(CONFIG.firebase.projectId && CONFIG.firebase.apiKey); },
      base() { return `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(CONFIG.firebase.projectId)}/databases/(default)/documents`; },
      key() { return encodeURIComponent(CONFIG.firebase.apiKey); },
      readLocal() { try { return JSON.parse(getLS('donia_reviews_v1') || '[]').filter(okRev); } catch (e) { return []; } },
      fromDoc(d) {
        const f = d.fields || {};
        return {
          id: (d.name || '').split('/').pop(),
          name: (f.name && f.name.stringValue) || '',
          productId: (f.productId && f.productId.stringValue) || '',
          rating: f.rating ? Number(f.rating.integerValue) : 0,
          comment: (f.comment && f.comment.stringValue) || '',
          createdAt: f.createdAt && f.createdAt.timestampValue ? Date.parse(f.createdAt.timestampValue) : NaN
        };
      },
      async load() {
        if (!this.online()) return this.readLocal();
        const res = await fetch(`${this.base()}:runQuery?key=${this.key()}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            structuredQuery: {
              from: [{ collectionId: 'reviews' }],
              where: { fieldFilter: { field: { fieldPath: 'status' }, op: 'EQUAL', value: { stringValue: 'approved' } } },
              limit: 500
            }
          })
        });
        if (!res.ok) throw await httpErr(res, 'reviews');
        const rows = await res.json();
        return rows.filter(r => r.document).map(r => this.fromDoc(r.document)).filter(okRev);
      },
      async add(r) {
        if (!this.online()) {
          const all = this.readLocal(); all.push(r); setLS('donia_reviews_v1', JSON.stringify(all)); return 'approved';
        }
        const status = CONFIG.moderateReviews ? 'pending' : 'approved';
        const res = await fetch(`${this.base()}/reviews?key=${this.key()}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fields: {
              name: { stringValue: r.name },
              productId: { stringValue: r.productId },
              rating: { integerValue: String(r.rating) },
              comment: { stringValue: r.comment },
              createdAt: { timestampValue: new Date(r.createdAt).toISOString() },
              status: { stringValue: status }
            }
          })
        });
        if (!res.ok) throw await httpErr(res, 'add-review');
        return status;
      }
    };

    }

    </div>`;
      const side = `<div class="rv-side"><p>${tr('revShareP')}</p>

      else if (state.revStatus === 'error') body = `<div class="empty"><p>${tr('revError')}</p>${DEBUG ? `<p class="hint num" style="max-width:520px;overflow-wrap:anywhere">${esc(state.revErr || '')}</p>` : ''}<button class="btn ghost" data-act="rv-retry">${tr('retry')}</button></div>`;
      else if (!list.length) body = `<div class="empty"><p>${state.revFilter ? tr('noProdRev') : tr('firstRev')}</p></div>`;

          const p = byId(r.productId);
          return `<article class="rev"><div class="who"><b>${esc(r.name)}</b><small>${fmtDate(r.createdAt)}</small></div>${rate(r.rating, 'sm')}<span class="prod">${p ? esc(p.brand) + ' - ' + esc(pName(p)) : tr('dproduct')}</span>${r.comment ? `<p dir="auto">${esc(r.comment)}</p>` : ''}</article>`;
        }).join('')}</div>${list.length > shown.length ? `<div class="more"><button class="btn ghost" data-act="rv-more">${tr('showMore')}</button></div>` : ''}`;
      }
      box.innerHTML = `<div class="rv-top">${score}${side}</div>${body}`;
    }
    async function loadReviews() {
      state.revStatus = 'loading'; renderReviews();

      catch (e) { console.error('[DONIA] reviews:', e); state.revErr = String((e && e.message) || e); state.reviews = []; state.revStatus = 'error'; }

    /* ====================== الأحداث ====================== */
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-act],[data-open],[data-add],[data-inc],[data-dec],[data-del],[data-filter]');
      if (!el) return;
      const d = el.dataset;

      if (d.open) return openModal(d.open);
      if (d.add) return addToCart(d.add);
      if (d.inc) { state.cart[d.inc] = Math.min(20, state.cart[d.inc] + 1); saveCart(); updateBadge(); return renderCart(); }
      if (d.dec) { state.cart[d.dec] = state.cart[d.dec] - 1; if (state.cart[d.dec] <= 0) delete state.cart[d.dec]; saveCart(); updateBadge(); return renderCart(); }
      if (d.del) { delete state.cart[d.del]; saveCart(); updateBadge(); return renderCart(); }

      if (d.filter) {
        const [k, v] = d.filter.split(':');
        if (d.only) { state.type = state.skin = state.concern = state.brand = ''; state[k] = v; }
        else state[k] = (state[k] === v) ? '' : v;
        if (d.only) { closeAll(); closeDnav(); }
        refresh(); if (d.only) goProducts();
        return;
      }

      switch (d.act) {
        case 'lang': setLang(LANG === 'ar' ? 'en' : 'ar'); break;
        case 'menu':
          if (window.matchMedia('(min-width:900px)').matches) toggleDnav();
          else { renderMenu(); openDrawer('#menuDrawer'); }
          break;
        case 'search': { const s = $('#searchbar'); s.hidden = !s.hidden; if (!s.hidden) $('#q').focus(); break; }
        case 'cart': openCart('cart'); break;
        case 'close-all': closeAll(); closeDnav(); break;
        case 'close-dnav': closeDnav(); break;
        case 'close-modal': if (el.classList.contains('modal') && e.target !== el) return; closeAll(); break;
        case 'clear': state.q = state.type = state.skin = state.concern = state.brand = ''; $('#q').value = ''; refresh(); break;
        case 'home': closeAll(); closeDnav(); state.q = state.type = state.skin = state.concern = state.brand = ''; $('#q').value = ''; refresh(); window.scrollTo(0, 0); break;
        case 'mq+': state.qty = Math.min(20, state.qty + 1); $('#mq').textContent = state.qty; break;
        case 'mq-': state.qty = Math.max(1, state.qty - 1); $('#mq').textContent = state.qty; break;
        case 'modal-add': addToCart(state.openId, state.qty); closeAll(); break;
        case 'apply': {
          const code = ($('#cpn').value || '').trim().toUpperCase();
          if (!code) return;
          if (CONFIG.coupons[code]) { state.coupon = code; renderCart(); }
          else { state.coupon = null; renderCart(); const m = $('#cmsg'); if (m) { m.className = 'cmsg bad'; m.textContent = tr('cpnBad'); } }
          break;
        }
        case 'checkout': state.view = 'checkout'; renderCart(); $('#cartBody').scrollTop = 0; break;
        case 'back': state.view = 'cart'; renderCart(); break;
        case 'submit': submitOrder(); break;
        case 'copy': {
          const txt = state.order.msg;
          const fallback = () => { const r = document.createRange(); r.selectNodeContents($('#msg')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast(tr('selectCopy')); };
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast(tr('copied'))).catch(fallback);
          else fallback();
          break;
        }
        case 'cat-retry': loadCatalog(); break;
        case 'rv-open': openReviewForm(d.p); break;
        case 'rv-star': setStars(+d.v); break;

        case 'rv-more': state.revShown += 6; renderReviews(); break;
        case 'rv-retry': loadReviews(); break;

    /* ====================== لوحة التحكم (الرابط: الموقع/#admin) ====================== */
    const A = { authed: false, tab: 'orders', view: 'list', products: [], settings: null, reviews: [], orders: [], ofilter: '', ordersErr: '', edit: null, err: '', busy: false, loaded: false, del: '', saving: false };
    const AUTH = { id: '', refresh: '', exp: 0 };
    const AUTH_ERRS = { INVALID_LOGIN_CREDENTIALS: 'الإيميل أو كلمة السر غلط', INVALID_PASSWORD: 'الإيميل أو كلمة السر غلط', EMAIL_NOT_FOUND: 'الإيميل أو كلمة السر غلط', INVALID_EMAIL: 'اكتب إيميل صحيح', TOO_MANY_ATTEMPTS_TRY_LATER: 'محاولات كثيرة، جرّب بعد شوي', USER_DISABLED: 'هذا الحساب موقوف' };
    const newId = () => 'n' + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);

    function setTok(id, refresh, sec) {
      AUTH.id = id; AUTH.refresh = refresh; AUTH.exp = Date.now() + Math.max(60, sec - 60) * 1000;
      try { sessionStorage.setItem('donia_rt', refresh); } catch (e) { }
    }
    async function admSignIn(email, password) {
      const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${REV.key()}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password, returnSecureToken: true })
      });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error((j.error && j.error.message) || 'AUTH');
      setTok(j.idToken, j.refreshToken, +j.expiresIn || 3600);
    }
    async function admRefreshTok() {
      let rt = AUTH.refresh; if (!rt) { try { rt = sessionStorage.getItem('donia_rt') || ''; } catch (e) { } }
      if (!rt) return false;
      const res = await fetch(`https://securetoken.googleapis.com/v1/token?key=${REV.key()}`, {
        method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(rt)
      });
      if (!res.ok) return false;
      const j = await res.json(); setTok(j.id_token, j.refresh_token, +j.expires_in || 3600); return true;
    }
    async function authFetch(url, opts = {}) {
      if (Date.now() >= AUTH.exp && !(await admRefreshTok())) throw new Error('SESSION');
      const res = await fetch(url, Object.assign({}, opts, { headers: Object.assign({ 'Content-Type': 'application/json', Authorization: 'Bearer ' + AUTH.id }, opts.headers || {}) }));
      if (res.status === 401 || res.status === 403) throw new Error('DENIED');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json().catch(() => null);
    }
    function admErrMsg(e) {
      const m = String((e && e.message) || e);
      if (m === 'DENIED') return 'ما عندك صلاحية الحفظ. تأكد إنك داخل بحساب الأدمن وإن الـ UID صحيح بقواعد Firebase.';
      if (m === 'SESSION') { A.authed = false; return 'انتهت الجلسة، سجّل دخول من جديد.'; }
      if (/quota/i.test(m)) return 'المساحة ما بتكفي (وضع التجربة). جرّب صور أصغر.';
      return 'صار خطأ، جرّب مرة ثانية.';
    }

    function orderNorm(o) {
      if (!o) return null;
      let det = { items: [] }; try { det = JSON.parse(o.itemsJson || '{}'); } catch (e) { }
      return {
        id: String(o.id || ''), orderNo: String(o.orderNo || ''), name: String(o.name || ''), phone: String(o.phone || ''), city: String(o.city || ''), area: String(o.area || ''),
        address: String(o.address || ''), note: String(o.note || ''), coupon: String(o.coupon || ''), subtotal: +o.subtotal || 0, discount: +o.discount || 0, delivery: +o.delivery || 0, total: +o.total || 0,
        status: ORDER_LABELS[o.status] ? o.status : 'new', createdAt: +o.createdAt || 0, det: det && typeof det === 'object' ? det : { items: [] }
      };
    }
    function orderFromDoc(d) {
      const f = d.fields || {}, s = k => (f[k] && f[k].stringValue) || '', n = k => f[k] ? Number(f[k].doubleValue !== undefined ? f[k].doubleValue : f[k].integerValue) : 0;
      return orderNorm({
        id: d.name.split('/').pop(), orderNo: s('orderNo'), name: s('name'), phone: s('phone'), city: s('city'), area: s('area'), address: s('address'), note: s('note'), coupon: s('coupon'),
        itemsJson: s('itemsJson'), subtotal: n('subtotal'), discount: n('discount'), delivery: n('delivery'), total: n('total'), status: s('status') || 'new',
        createdAt: f.createdAt && f.createdAt.timestampValue ? Date.parse(f.createdAt.timestampValue) : 0
      });
    }
    function waPhone(p) {
      let d = String(p || '').replace(/\D/g, '');
      if (d.startsWith('00')) d = d.slice(2);
      if (d.startsWith('962')) return d;
      if (d.startsWith('0')) return '962' + d.slice(1);
      if (d.length === 9) return '962' + d;
      return d;
    }
    function fmtDT(ts) {
      try { return new Date(ts).toLocaleString('ar-JO-u-nu-latn', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }); }
      catch (e) { return new Date(ts).toISOString().slice(0, 16).replace('T', ' '); }
    }

    /* كتابة/قراءة (أونلاين بعد تسجيل الدخول، أو محلي بوضع التجربة) */
    const ADB = {
      async saveProduct(p) {
        const { image, ...rest } = p;
        if (!REV.online()) {
          const list = LOC.getProducts() || []; const row = { raw: rest, image: image || '' };
          const i = list.findIndex(x => x.raw.id === p.id); if (i >= 0) list[i] = row; else list.push(row);
          return LOC.setProducts(list);
        }
        await authFetch(`${REV.base()}/products/${encodeURIComponent(p.id)}?key=${REV.key()}`, { method: 'PATCH', body: JSON.stringify({ fields: { json: { stringValue: JSON.stringify(rest) }, image: { stringValue: image || '' } } }) });
      },
      async deleteProduct(id) {
        if (!REV.online()) return LOC.setProducts((LOC.getProducts() || []).filter(x => x.raw.id !== id));
        await authFetch(`${REV.base()}/products/${encodeURIComponent(id)}?key=${REV.key()}`, { method: 'DELETE' });
      },
      async saveSettings(s) {
        if (!REV.online()) return LOC.setSettings(s);
        const { heroImage, ...rest } = s;
        await authFetch(`${REV.base()}/config/store?key=${REV.key()}`, { method: 'PATCH', body: JSON.stringify({ fields: { json: { stringValue: JSON.stringify(rest) }, heroImage: { stringValue: heroImage || '' } } }) });
      },
      async listReviews() {
        if (!REV.online()) return REV.readLocal().map(r => Object.assign({ status: 'approved' }, r));
        const rows = await authFetch(`${REV.base()}:runQuery?key=${REV.key()}`, { method: 'POST', body: JSON.stringify({ structuredQuery: { from: [{ collectionId: 'reviews' }], orderBy: [{ field: { fieldPath: 'createdAt' }, direction: 'DESCENDING' }], limit: 300 } }) });
        return (rows || []).filter(r => r.document).map(r => Object.assign(REV.fromDoc(r.document), { status: (r.document.fields.status && r.document.fields.status.stringValue) || 'pending' })).filter(okRev);
      },
      async setReview(id, status) {
        await authFetch(`${REV.base()}/reviews/${encodeURIComponent(id)}?updateMask.fieldPaths=status&key=${REV.key()}`, { method: 'PATCH', body: JSON.stringify({ fields: { status: { stringValue: status } } }) });
      },
      async listOrders() {
        if (!REV.online()) {
          let all = []; try { all = JSON.parse(getLS('donia_orders_v1') || '[]'); } catch (e) { }
          return all.map(o => orderNorm(Object.assign({}, o))).filter(Boolean);
        }
        const rows = await authFetch(`${REV.base()}:runQuery?key=${REV.key()}`, { method: 'POST', body: JSON.stringify({ structuredQuery: { from: [{ collectionId: 'orders' }], orderBy: [{ field: { fieldPath: 'createdAt' }, direction: 'DESCENDING' }], limit: 300 } }) });
        return (rows || []).filter(r => r.document).map(r => orderFromDoc(r.document)).filter(Boolean);
      },
      async setOrderStatus(id, status) {
        if (!REV.online()) { let all = []; try { all = JSON.parse(getLS('donia_orders_v1') || '[]'); } catch (e) { } const o = all.find(x => x.id === id); if (o) o.status = status; return setLS('donia_orders_v1', JSON.stringify(all)); }
        await authFetch(`${REV.base()}/orders/${encodeURIComponent(id)}?updateMask.fieldPaths=status&key=${REV.key()}`, { method: 'PATCH', body: JSON.stringify({ fields: { status: { stringValue: status } } }) });
      },
      async deleteOrder(id) {
        if (!REV.online()) { let all = []; try { all = JSON.parse(getLS('donia_orders_v1') || '[]'); } catch (e) { } return setLS('donia_orders_v1', JSON.stringify(all.filter(x => x.id !== id))); }
        await authFetch(`${REV.base()}/orders/${encodeURIComponent(id)}?key=${REV.key()}`, { method: 'DELETE' });
      },
      async deleteReview(id) {
        if (!REV.online()) { setLS('donia_reviews_v1', JSON.stringify(REV.readLocal().filter(r => r.id !== id))); return; }
        await authFetch(`${REV.base()}/reviews/${encodeURIComponent(id)}?key=${REV.key()}`, { method: 'DELETE' });
      }

    const CAN_WEBP = (() => { try { return document.createElement('canvas').toDataURL('image/webp').startsWith('data:image/webp'); } catch (e) { return false; } })();
    function compressImage(file, maxSide, limit) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file), img = new Image();
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('IMG')); };
        img.onload = () => {
          let side = maxSide, q = 0.85;
          for (let i = 0; i < 8; i++) {
            const k = Math.min(1, side / Math.max(img.width, img.height));
            const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
            const x = c.getContext('2d');
            if (!CAN_WEBP) { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); }
            x.drawImage(img, 0, 0, c.width, c.height);
            const out = c.toDataURL(CAN_WEBP ? 'image/webp' : 'image/jpeg', q);
            if (out.length <= limit) { URL.revokeObjectURL(url); return resolve(out); }
            q = Math.max(0.5, q - 0.1); side = Math.round(side * 0.85);
          }
          URL.revokeObjectURL(url); reject(new Error('BIG'));
        };
        img.src = url;
      });

    function admReviewsHTML() {
      const list = A.reviews.slice().sort((a, b) => (a.status === 'pending' ? 0 : 1) - (b.status === 'pending' ? 0 : 1) || b.createdAt - a.createdAt);
      const rows = list.map(r => {
        const p = PRODUCTS.find(x => x.id === r.productId) || A.products.find(x => x.id === r.productId);
        return `<div class="card-box"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><b>${esc(r.name)}</b><span class="flag">${r.status === 'pending' ? 'بانتظار الموافقة' : 'منشور'}</span></div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${REV.online() ? (r.status === 'pending' ? `<button class="btn sm" data-a="rv-ok" data-id="${esc(r.id)}">موافقة ونشر</button>` : `<button class="btn ghost sm" data-a="rv-hide" data-id="${esc(r.id)}">إخفاء</button>`) : ''}

    /* ---------- تجميع القيم من النماذج ---------- */
    function admCollect() {
      const e = A.edit; if (!e) return; const p = e.p; const v = id => { const el = $('#' + id); return el ? el.value : ''; };
      if (!$('#pf-ar')) return;
      p.ar = v('pf-ar'); p.brand = v('pf-brand'); p.name = v('pf-name'); p.desc = v('pf-desc'); p.descEn = v('pf-descEn'); p.price = v('pf-price'); p.old = v('pf-old'); p.type = v('pf-type') || p.type;
      ['skin', 'concern', 'sections'].forEach(k => { p[k] = [...document.querySelectorAll(`[data-arr="${k}"]:checked`)].map(x => x.value); });
      p.soon = !!$('#pf-soon').checked; p.visible = !!$('#pf-visible').checked;
    }
    function setPath(o, path, val) { const ks = path.split('.'); const last = ks.pop(); ks.forEach(k => { o = o[k]; }); o[last] = val; }
    function admDiscountHelper(id) {
      const price = $('#pf-price'), old = $('#pf-old'), pct = $('#pf-pct'), hint = $('#pf-hint'); if (!price) return;
      if (id === 'pf-pct') {
        const k = parseFloat(pct.value); let o = parseFloat(old.value);
        if (!(o > 0) && parseFloat(price.value) > 0) { o = parseFloat(price.value); old.value = o; }
        if (k > 0 && k < 100 && o > 0) price.value = (Math.round(o * (1 - k / 100) * 1000) / 1000).toFixed(3);
      }
      const p = parseFloat(price.value), o2 = parseFloat(old.value);
      hint.textContent = o2 > p && p > 0 ? `خصم ${Math.round((o2 - p) / o2 * 100)}%: الزبون بيوفّر ${fmt(o2 - p)}` : '';
    }
    function admSettingsClean() {
      const s = A.settings;
      return {
        whatsapp: String(s.whatsapp || '').replace(/\D/g, ''), freeShipping: num(s.freeShipping, 35),
        deliveryAmman: num(s.deliveryAmman, 2), deliveryOther: num(s.deliveryOther, 3),
        promoText: clean(s.promoText || ''), promoTextEn: clean(s.promoTextEn || ''), heroImage: okImg(s.heroImage) ? s.heroImage : '',
        instagram: clean(s.instagram || ''),
        coupons: (s.coupons || []).map(c => ({ code: String(c.code).toUpperCase(), type: c.type === 'fixed' ? 'fixed' : 'percent', value: num(c.value), min: num(c.min), active: c.active !== false })),
        auto: { on: !!s.auto.on, type: s.auto.type === 'fixed' ? 'fixed' : 'percent', value: num(s.auto.value), min: num(s.auto.min), label: clean(s.auto.label || ''), labelEn: clean(s.auto.labelEn || '') }
      };
    }
    async function admSaveSettings(silent) {
      const clean_ = admSettingsClean();
      if (clean_.whatsapp && (clean_.whatsapp.length < 9 || clean_.whatsapp.length > 15)) { A.err = 'رقم الواتساب لازم يكون بين 9 و15 رقم'; admRender(); $('#adm').scrollTop = 0; return; }
      A.saving = true; if (!silent) admRender();
      try { await ADB.saveSettings(clean_); A.settings = mergeSettings(clean_); A.err = ''; toast('تم الحفظ'); }
      catch (e) { A.err = admErrMsg(e); }
      A.saving = false; admRender(); if (A.err) $('#adm').scrollTop = 0;
    }
    async function admSaveProduct() {
      admCollect(); const p = A.edit.p, errs = [];
      const price = parseFloat(p.price), old = p.old === '' || p.old == null ? 0 : parseFloat(p.old);
      if (!clean(p.ar)) errs.push('اكتب اسم المنتج بالعربي');
      if (!(price > 0)) errs.push('اكتب السعر');
      if (old && !(old > price)) errs.push('السعر قبل الخصم لازم يكون أكبر من السعر بعد الخصم');
      if (errs.length) { A.err = errs.join(' - '); admRender(); $('#adm').scrollTop = 0; return; }
      const out = { id: p.id, ar: clean(p.ar), brand: clean(p.brand), name: clean(p.name), desc: clean(p.desc), descEn: clean(p.descEn), price: r3(price), old: old ? r3(old) : 0, type: p.type, skin: p.skin, concern: p.concern, sections: p.sections, soon: p.soon, visible: p.visible, ord: p.ord || Date.now(), shape: p.shape, c: p.c, image: p.image || '' };
      A.saving = true; A.err = ''; admRender();
      try {
        await ADB.saveProduct(out);
        const n = normProduct(out, out.image); const i = A.products.findIndex(x => x.id === n.id);
        if (i >= 0) A.products[i] = n; else A.products.push(n);
        A.view = 'list'; A.edit = null; toast('تم الحفظ');
      } catch (e) { A.err = admErrMsg(e); }
      A.saving = false; admRender(); $('#adm').scrollTop = 0;
    }
    async function admSeed() {
      A.busy = true; A.loaded = true; admRender();
      try {
        for (let i = 0; i < SAMPLES.length; i++) {
          const { ...raw } = SAMPLES[i]; raw.visible = true; raw.ord = i + 1;
          await ADB.saveProduct(Object.assign({}, raw, { image: '' }));
        }
        toast('تم استيراد المنتجات');
      } catch (e) { A.err = admErrMsg(e); }
      await admLoad();
    }

    /* ---------- الأحداث ---------- */
    document.addEventListener('click', async e => {
      const el = e.target.closest('[data-a]'); if (!el) return;
      const a = el.dataset.a, id = el.dataset.id;
      if (a === 'exit') e.preventDefault();
      if (!['del', 'rv-del', 'cp-del', 'ord-del'].includes(a)) A.del = '';
      const rerender = () => admRender();
      try {
        switch (a) {
          case 'exit': admExit(); break;
          case 'demo-in': A.authed = true; admLoad(); break;
          case 'login': {
            const email = $('#ad-email').value.trim(), pass = $('#ad-pass').value;
            if (!email || !pass) { $('#ad-err').textContent = 'اكتب الإيميل وكلمة السر'; return; }
            const b = $('#ad-login'); b.disabled = true; b.textContent = 'جاري الدخول...';
            try { await admSignIn(email, pass); A.authed = true; A.err = ''; admLoad(); }
            catch (err) { const k = Object.keys(AUTH_ERRS).find(x => String(err.message).startsWith(x)); A.err = k ? AUTH_ERRS[k] : 'ما قدرنا ندخل، جرّب مرة ثانية'; $('#ad-err').textContent = A.err; b.disabled = false; b.textContent = 'دخول'; $('#ad-pass').value = ''; $('#ad-pass').focus(); }
            break;
          }
          case 'logout': AUTH.id = AUTH.refresh = ''; AUTH.exp = 0; try { sessionStorage.removeItem('donia_rt'); } catch (x) { } A.authed = false; A.loaded = false; A.err = ''; rerender(); break;
          case 'reload': admLoad(); break;
          case 'tab': A.tab = el.dataset.t; A.err = ''; rerender(); $('#adm').scrollTop = 0; break;
          case 'seed': admSeed(); break;
          case 'new': A.edit = { isNew: true, p: { id: newId(), ar: '', brand: '', name: '', desc: '', descEn: '', price: '', old: '', type: 'serum', skin: [], concern: [], sections: ['new'], soon: false, visible: true, ord: 0, shape: 'tube', c: { body: '#F6EEE8', accent: '#8A6350', cap: '#E9D7CB', swatch: '#E4CBBB' }, image: '' } }; A.view = 'edit'; A.err = ''; rerender(); $('#adm').scrollTop = 0; break;
          case 'edit': { const p = A.products.find(x => x.id === id); if (!p) return; A.edit = { isNew: false, p: JSON.parse(JSON.stringify(p)) }; A.view = 'edit'; A.err = ''; rerender(); $('#adm').scrollTop = 0; break; }
          case 'back': A.view = 'list'; A.edit = null; A.err = ''; rerender(); break;
          case 'img-clear': admCollect(); A.edit.p.image = ''; rerender(); admDiscountHelper(); break;
          case 'save': admSaveProduct(); break;
          case 'del':
            if (A.del !== 'p:' + id) { A.del = 'p:' + id; rerender(); break; }
            try { await ADB.deleteProduct(id); A.products = A.products.filter(x => x.id !== id); A.view = 'list'; A.edit = null; A.del = ''; toast('تم حذف المنتج'); }
            catch (err) { A.err = admErrMsg(err); A.del = ''; }
            rerender(); break;
          case 'save-settings': admSaveSettings(); break;
          case 'cp-add': {
            const code = ($('#cp-code').value || '').trim().toUpperCase(), type = $('#cp-type').value, val = parseFloat($('#cp-val').value), min = num($('#cp-min').value);
            if (!/^[A-Z0-9_-]{3,20}$/.test(code)) { A.err = 'الكود لازم يكون 3 لـ 20 حرف إنجليزي أو رقم'; rerender(); $('#adm').scrollTop = 0; break; }
            if (!(val > 0) || (type === 'percent' && val > 100)) { A.err = 'اكتب قيمة خصم صحيحة'; rerender(); $('#adm').scrollTop = 0; break; }
            A.err = ''; A.settings.coupons = A.settings.coupons.filter(c => c.code !== code).concat({ code, type, value: val, min, active: true });
            await admSaveSettings(true); break;
          }
          case 'cp-del': {
            const i = +el.dataset.i;
            if (A.del !== 'c:' + i) { A.del = 'c:' + i; rerender(); break; }
            A.del = ''; A.settings.coupons.splice(i, 1); await admSaveSettings(true); break;
          }
          case 'hero-clear': A.settings.heroImage = ''; rerender(); break;
          case 'ofilter': A.ofilter = el.dataset.k; rerender(); break;
          case 'ord-reload': admReloadOrders(false); break;
          case 'ord-wa': { const o = A.orders.find(x => x.id === id); if (o && o.status === 'new') { try { await ADB.setOrderStatus(id, 'contacted'); o.status = 'contacted'; } catch (err) { } setTimeout(rerender, 300); } break; }
          case 'ord-del':
            if (A.del !== 'o:' + id) { A.del = 'o:' + id; rerender(); break; }
            try { await ADB.deleteOrder(id); A.orders = A.orders.filter(x => x.id !== id); A.del = ''; toast('تم حذف الطلب'); }
            catch (err) { A.err = admErrMsg(err); A.del = ''; }
            rerender(); break;
          case 'rv-ok': case 'rv-hide': {
            const st = a === 'rv-ok' ? 'approved' : 'pending';
            try { await ADB.setReview(id, st); const r = A.reviews.find(x => x.id === id); if (r) r.status = st; toast(st === 'approved' ? 'تم نشر الرأي' : 'تم إخفاء الرأي'); }
            catch (err) { A.err = admErrMsg(err); }
            rerender(); break;
          }
          case 'rv-del':
            if (A.del !== 'r:' + id) { A.del = 'r:' + id; rerender(); break; }
            try { await ADB.deleteReview(id); A.reviews = A.reviews.filter(x => x.id !== id); A.del = ''; toast('تم حذف الرأي'); }
            catch (err) { A.err = admErrMsg(err); A.del = ''; }
            rerender(); break;
        }
      } catch (err) { A.err = admErrMsg(err); admRender(); }

      $('#btnSearch').insertAdjacentHTML('afterbegin', ic('search'));
      $('#btnCart').insertAdjacentHTML('afterbegin', ic('bag'));
      $('#logo').innerHTML = logoHTML(); $('#footLogo').innerHTML = logoHTML();
      document.title = CONFIG.storeName + ' | Beauty & Cosmetics';
      const wa = `https://wa.me/${CONFIG.whatsapp}`;
      $('#waFab').href = wa; $('#footWa').href = wa;
      $('#waFab').innerHTML = `${ic('chat', 22)}<span data-i18n="waFab">تواصل معنا</span>`;
      if (CONFIG.instagram) { $('#igFab').href = CONFIG.instagram; $('#footIg').href = CONFIG.instagram; }
      $('#igFab').innerHTML = ic('camera', 22);
      $('#footIg').insertAdjacentHTML('afterbegin', ic('camera', 18));
      const HB = (shape, c) => art({ brand: 'DONIA', ar: 'DONIA', shape, c });
      $('#heroArt').innerHTML = `<div class="halo"></div><div class="a1">${HB('tube', { body: '#F6EEE8', accent: '#8A6350', cap: '#E9D7CB', swatch: '#DCC6B8' })}</div><div class="a2">${HB('pump', { body: '#8A6350', accent: '#6E4C3B', cap: '#5A3A2B', swatch: '#E4CBBB' })}</div><div class="a3">${HB('dropper', { body: '#E9D7CB', accent: '#8A6350', cap: '#B98A6E', swatch: '#DCC6B8' })}</div>`;
      $('#heroArt').querySelectorAll('div[class^="a"]').forEach(w => { const sv = w.querySelector('svg'); sv.setAttribute('class', w.className); w.replaceWith(sv); });
      applyLang();
      loadCart(); updateBadge(); refresh(); loadCatalog(); loadReviews();
      window.addEventListener('hashchange', route); route();
    }
    init();
  </script>
</body>

</html>
