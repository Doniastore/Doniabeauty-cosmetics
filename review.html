<style>
:root{--ink:#3A222A;--muted:#8C6C74;--line:#F0D7DE;--rose:#C6567A;--soft:#FBEEF1;--tile:#FDF2F4;--star:#D6A93B;--bg:#FFF8F9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{font-family:'Readex Pro',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh}
body.lock{overflow:hidden}
.wrap{max-width:520px;margin:0 auto;padding:22px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.brand{display:flex;justify-content:center;margin-bottom:14px}
.brand img{width:60px;height:60px;border-radius:14px}
h1{font-family:'Amiri',serif;font-size:26px;margin:0 0 4px;text-align:center}
.sub{color:var(--muted);text-align:center;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:500;margin:0 0 6px}
input,textarea{width:100%;font:inherit;color:inherit;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;min-height:48px}
textarea{min-height:84px;resize:vertical;margin-top:6px}
input:focus,textarea:focus{outline:2px solid var(--rose);outline-offset:1px}
.btn{display:block;width:100%;background:var(--rose);color:#fff;border:0;border-radius:999px;font:inherit;font-weight:600;padding:14px;min-height:50px;cursor:pointer;text-align:center;text-decoration:none}
.btn:disabled{opacity:.6}
.btn.ghost{background:#fff;color:var(--rose);border:1px solid var(--rose)}
.err{color:#C0392B;font-size:14px;margin:6px 0 0;min-height:1em}
.hint{color:var(--muted);font-size:13.5px}
.done{text-align:center;padding:30px 10px}.done .big{font-size:56px}
/* بطاقة المنتج المختار + التقييم */
.rc{display:grid;gap:8px}
.rc-top{display:flex;gap:12px;align-items:center}
.rc-top .im{width:68px;height:68px;border-radius:14px;overflow:hidden;background:var(--tile);flex:none;display:grid;place-items:center}
.rc-top img{width:100%;height:100%;object-fit:cover;display:block}
.rc-top b{display:block;line-height:1.4}.rc-top small{color:var(--muted)}
.rc-x{margin-inline-start:auto;background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer;padding:6px}
.stars{display:flex;gap:6px;direction:ltr;justify-content:center}
.stars button{background:none;border:0;padding:2px;cursor:pointer;font-size:38px;line-height:1;color:#E5D3D8;transition:transform .12s}
.stars button.on{color:var(--star)}
.stars button:active{transform:scale(1.15)}
/* شبكة المنتجات */
.ov{position:fixed;inset:0;z-index:50;background:rgba(58,34,42,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92%;display:flex;flex-direction:column;border-radius:26px 26px 0 0;animation:up .28s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:26px;max-height:88%}}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
.sh-head h2{font-family:'Amiri',serif;font-size:22px;margin:0}
.sh-x{background:var(--soft);border:0;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer;color:var(--ink)}
.sh-search{padding:0 18px 8px}
.grid{overflow-y:auto;padding:8px 18px 12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;background:#fff;border:2px solid var(--line);border-radius:18px;padding:8px;text-align:start;cursor:pointer;font:inherit;color:inherit;display:block;width:100%}
.tile[aria-pressed="true"]{border-color:var(--rose);background:var(--soft)}
.tile .sq{aspect-ratio:1/1;border-radius:12px;background:var(--tile);overflow:hidden;display:grid;place-items:center}
.tile .sq img{width:100%;height:100%;object-fit:cover;display:block}
.ph{font-family:'Amiri',serif;font-size:34px;color:var(--rose)}
.tile small{display:block;color:var(--muted);margin-top:8px;font-size:12px;line-height:1.3}
.tile b{display:block;font-size:14px;line-height:1.35;font-weight:600}
.circ{position:absolute;top:14px;inset-inline-start:14px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.92);border:2px solid var(--rose);display:grid;place-items:center;color:#fff;font-size:16px;line-height:1}
.tile[aria-pressed="true"] .circ{background:var(--rose)}
.sh-foot{padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
[hidden]{display:none!important}
</style>
</head>

/* نفس إعدادات الموقع الرئيسي. لازم تبقى مطابقة لـ CONFIG في index.html */
const FB = { projectId: 'doniastore-cee4a', apiKey: 'AIzaSyBOsxlTBcKtcH_v1SXDAC3_0eXB4nqTV3E' };
const MODERATE = false;   // نفس moderateReviews بالموقع: false = الرأي بينشر فوراً
const BASE = `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(FB.projectId)}/databases/(default)/documents`;
const KEY = encodeURIComponent(FB.apiKey);
const $ = s => document.querySelector(s);
const esc = x => String(x == null ? '' : x).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const q = new URLSearchParams(location.search);
const preIds = (q.get('p') || '').split(',').map(x => x.trim()).filter(x => /^[\w-]{1,40}$/.test(x)).slice(0, 8);
const ordNo = (q.get('o') || '').replace(/[^\w-]/g, '').slice(0, 30);
const doneKey = 'donia_rv_done_' + (ordNo || preIds.join('_') || 'any');
const siteUrl = new URL('index.html#reviews', location.href.replace('review.html', 'index.html')).href;
let prods = [], sel = [], tmp = [];
const st = {}, cm = {}; let nm = (q.get('n') || '').slice(0, 40);

const docToProd = d => { const f = d.fields || {}, raw = JSON.parse(f.json.stringValue); return { id: d.name.split('/').pop(), ar: raw.ar || raw.name || '', brand: raw.brand || '', image: (f.image && f.image.stringValue) || '', hide: raw.visible === false || !!raw.soon }; };
async function getAll() {
  const out = []; let tok = '';
  for (let i = 0; i < 5; i++) {
    const r = await fetch(`${BASE}/products?pageSize=200&key=${KEY}${tok ? '&pageToken=' + encodeURIComponent(tok) : ''}`);
    if (!r.ok) throw new Error('load');
    const j = await r.json();
    (j.documents || []).forEach(d => { try { out.push(docToProd(d)); } catch (e) { } });
    tok = j.nextPageToken; if (!tok) break;
  }
  return out;
}
const byId = id => prods.find(p => p.id === id);
const imgOf = p => p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy">` : `<span class="ph">${esc((p.brand || p.ar || '?').trim().charAt(0).toUpperCase())}</span>`;

function render() {
  if (localStorage.getItem(doneKey)) return thanks(true);
  const cards = sel.map(id => { const p = byId(id); if (!p) return ''; return `<div class="card rc" data-pid="${esc(id)}">
    <div class="rc-top"><div class="im">${imgOf(p)}</div><div><b>${esc(p.ar)}</b><small>${esc(p.brand)}</small></div><button class="rc-x" data-rm="${esc(id)}" aria-label="إزالة">✕</button></div>
    <div class="stars" role="radiogroup" aria-label="التقييم" data-id="${esc(id)}">${[1, 2, 3, 4, 5].map(n => `<button type="button" role="radio" class="${(st[id] || 0) >= n ? 'on' : ''}" aria-checked="${st[id] === n}" aria-label="${n} من 5" data-n="${n}">★</button>`).join('')}</div>
    <textarea data-c="${esc(id)}" maxlength="400" placeholder="رأيك بالمنتج (اختياري)">${esc(cm[id] || '')}</textarea></div>`; }).join('');
  $('#app').innerHTML = `<h1>كيف كانت تجربتك؟</h1><p class="sub">رأيك بيهمنا وبيظهر بموقع DONIA</p>
    <div class="card"><label for="nm">اسمك</label><input id="nm" maxlength="40" autocomplete="name" value="${esc(nm)}"><p class="err" id="e-nm"></p></div>
    ${cards}
    <button class="btn ghost" id="pick" style="margin-bottom:14px">${sel.length ? '+ اختيار منتج آخر' : 'اختيار منتج'}</button>
    <p class="err" id="e-all" style="text-align:center"></p>
    <button class="btn" id="go"${sel.length ? '' : ' disabled'}>إرسال التقييم</button>`;
}
function drawGrid() {
  const t = ($('#srch').value || '').trim().toLowerCase();
  const list = prods.filter(p => (!p.hide || sel.includes(p.id)) && (!t || (p.ar + ' ' + p.brand).toLowerCase().includes(t)));
  $('#grid').innerHTML = list.length ? list.map(p => `<button class="tile" data-t="${esc(p.id)}" aria-pressed="${tmp.includes(p.id)}"><div class="sq">${imgOf(p)}</div><span class="circ" aria-hidden="true">${tmp.includes(p.id) ? '✓' : ''}</span><small>${esc(p.brand)}</small><b>${esc(p.ar)}</b></button>`).join('') : '<p class="hint" style="grid-column:1/-1;text-align:center">ما في منتجات</p>';
  $('#shdone').textContent = tmp.length ? `تم (${tmp.length})` : 'تم';
}
function openSheet() { tmp = sel.slice(); $('#srch').value = ''; $('#ov').hidden = false; document.body.classList.add('lock'); drawGrid(); }
function closeSheet() { $('#ov').hidden = true; document.body.classList.remove('lock'); }
function thanks(again) {
  $('#app').innerHTML = `<div class="card done"><div class="big">💗</div><h1>${again ? 'وصلنا رأيك من قبل' : 'شكراً لك!'}</h1><p class="sub">${again ? 'شكراً لوقتك.' : 'رأيك وصلنا وبيظهر بالموقع.'}</p><a class="btn" href="${esc(siteUrl)}">شوف آراء الزبائن بالموقع</a></div>`;
}
document.addEventListener('input', e => {
  if (e.target.id === 'nm') nm = e.target.value;
  else if (e.target.dataset && e.target.dataset.c) cm[e.target.dataset.c] = e.target.value;
  else if (e.target.id === 'srch') drawGrid();
});
document.addEventListener('click', async e => {
  const t = e.target;
  const star = t.closest('.stars button');
  if (star) { const g = star.parentElement, n = +star.dataset.n; st[g.dataset.id] = n; g.querySelectorAll('button').forEach(x => { x.classList.toggle('on', +x.dataset.n <= n); x.setAttribute('aria-checked', String(+x.dataset.n === n)); }); return; }
  const tile = t.closest('.tile');
  if (tile) { const id = tile.dataset.t; tmp = tmp.includes(id) ? tmp.filter(x => x !== id) : tmp.concat(id); drawGrid(); return; }
  const rm = t.closest('[data-rm]');
  if (rm) { sel = sel.filter(x => x !== rm.dataset.rm); render(); return; }
  if (t.id === 'pick') return openSheet();
  if (t.id === 'shx' || t.id === 'ov') return closeSheet();
  if (t.id === 'shdone') { sel = sel.filter(x => tmp.includes(x)).concat(tmp.filter(x => !sel.includes(x))); closeSheet(); render(); return; }
  if (t.id !== 'go') return;
  const name = nm.trim(); $('#e-nm').textContent = ''; $('#e-all').textContent = '';
  const rated = sel.filter(id => st[id]);
  if (name.length < 2) return void ($('#e-nm').textContent = 'اكتب اسمك (حرفين على الأقل)');
  if (!rated.length) return void ($('#e-all').textContent = 'اختر عدد النجوم لمنتج واحد على الأقل');
  t.disabled = true; t.textContent = 'جاري الإرسال...';
  try {
    for (const id of rated) {
      const r = await fetch(`${BASE}/reviews?key=${KEY}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: {
          name: { stringValue: name }, productId: { stringValue: id }, rating: { integerValue: String(st[id]) },
          comment: { stringValue: (cm[id] || '').trim().slice(0, 400) }, createdAt: { timestampValue: new Date().toISOString() },
          status: { stringValue: MODERATE ? 'pending' : 'approved' } } })
      });
      if (!r.ok) throw new Error('send');
    }
    try { localStorage.setItem(doneKey, '1'); } catch (x) { }
    thanks(false);
  } catch (err) { t.disabled = false; t.textContent = 'إرسال التقييم'; $('#e-all').textContent = 'ما قدرنا نرسل رأيك، جرّب مرة ثانية'; }
});
(async () => {
  try {
    prods = await getAll();
    sel = preIds.filter(id => byId(id));
    render();
  } catch (e) { $('#app').innerHTML = '<p class="sub">ما قدرنا نحمّل الصفحة، جرّب مرة ثانية.</p>'; }
})();
</script>
</body>
</html>
